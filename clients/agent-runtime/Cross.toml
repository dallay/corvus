# Cross.toml - cross-compilation configuration for clients/agent-runtime
#
# NOTE: aarch64-unknown-linux-gnu now builds natively on ARM64 runners.
# This file is retained for local development with `cross` if needed.
#
# aws-lc-sys (TLS) needs CMake and C build tools; surrealdb-librocksdb-sys
# (via cerebro) needs clang/libclang-dev for bindgen and g++ for C++ sources.
#
# Ref: https://github.com/cross-rs/cross/wiki/Configuration

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update -qq",
  "apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross cmake clang libclang-dev",
]
