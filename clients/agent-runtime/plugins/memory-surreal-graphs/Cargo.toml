[package]
name = "memory-surreal-graphs-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pilot WASM plugin artifact for Corvus surreal graph memory backend"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

