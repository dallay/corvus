# Corvus Docker Compose Example
# 
# Quick start:
#   1. Copy this file and set your API key
#   2. Run gateway only: docker compose up -d
#   3. Run gateway + dashboard: docker compose --profile dashboard up -d
#   4. Access gateway at http://localhost:3000 and dashboard at http://localhost:4324
#
# For more info: https://github.com/dallay/corvus

services:
  corvus:
    image: ghcr.io/dallay/corvus:latest
    # Or build locally:
    # build: .
    container_name: corvus
    restart: unless-stopped
    
    environment:
      # Required: Your LLM provider API key
      - API_KEY=${API_KEY:-}
      # Or use the prefixed version:
      # - CORVUS_API_KEY=${CORVUS_API_KEY:-}
      
      # Optional: LLM provider (default: openrouter)
      # Options: openrouter, openai, anthropic, ollama
      - PROVIDER=${PROVIDER:-openrouter}
      
      # Optional: Model override
      # - CORVUS_MODEL=anthropic/claude-sonnet-4-20250514

      # Optional: Cerebro memory service
      # - CORVUS_CEREBRO_ENDPOINT=https://cerebro.example.com/mcp
      # - CORVUS_CEREBRO_AUTH_TOKEN=
      # - CORVUS_CEREBRO_TIMEOUT_MS=30000
      # - CORVUS_CEREBRO_ALLOW_INSECURE_LOOPBACK=false
      
    volumes:
      # Persist workspace and config
      - corvus-data:/data
      
    ports:
      # Gateway API port
      - "127.0.0.1:3000:3000"
    
    # Health check
    healthcheck:
      test: ["CMD", "corvus", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional local web dashboard (local-first)
  dashboard:
    image: ghcr.io/dallay/corvus-dashboard:latest
    container_name: corvus-dashboard
    restart: unless-stopped
    depends_on:
      corvus:
        condition: service_healthy
    profiles: ["dashboard"]
    ports:
      - "127.0.0.1:4324:8080"

volumes:
  corvus-data:
