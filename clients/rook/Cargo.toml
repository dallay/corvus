[package]
name = "rook"
version = "0.1.0"
edition = "2021"
authors = ["theonlyhennygod"]
license = "Apache-2.0"
description = "Corvus Rook — standalone local-first AI provider gateway"
repository = "https://github.com/dallay/corvus"

[[bin]]
name = "rook"
path = "src/main.rs"

[lib]
name = "rook"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.42", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

# HTTP gateway
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1.0"

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# IDs
uuid = { version = "1.23", default-features = false, features = ["v4", "std", "serde"] }

# Persistence
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Asset embedding
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"

# Static file serving
tower-http = { version = "0.6", default-features = false, features = ["fs", "trace"] }

# HTTP response helpers
http = "1.0"

# Shared runtime contracts (no internal corvus binary dependency)
corvus-traits = { path = "../agent-runtime/crates/corvus-traits" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
