schema: spec-driven

context: |
  Tech stack: Kotlin Multiplatform + Compose, Rust runtime, TypeScript/Vue/Astro web monorepo.
  Architecture: Gradle multi-module monorepo with custom build-logic plugins; trait-driven Rust runtime; KMP shared core with platform clients.
  Testing: Gradle/JUnit (`kotlin("test")`), Cargo test, and pnpm workspace tests in web apps.
  Style: .editorconfig (2-space, 100-char Kotlin), Spotless/ktfmt + Detekt + Biome, GitHub Actions CI.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    guidance:
      - Follow existing code patterns and conventions
      - Load relevant coding skills for the project stack
    tdd: true
    test_command: "make test"
  verify:
    checks:
      - Execute tests as part of the standard verification stack
      - Compare implementation against every spec scenario
    test_command: "make test"
    build_command: "make build"
    # Interim baseline while legacy gaps are closed; increase over time.
    coverage_threshold: 60
  archive:
    - Warn before merging destructive deltas (large removals)
