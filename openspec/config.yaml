schema: spec-driven

context: |
  Corvus: multi-interface agentic platform monorepo.
  Stack: Kotlin Multiplatform, Rust runtime, Astro/Vue web apps.
  Build: Gradle (KMP), Cargo (Rust), pnpm (Web).
  Testing: JUnit/Kotest, cargo test, Vitest/Playwright.
  CI: GitHub Actions. Lint: ktlint, clippy, biome.
  Clients: composeApp (desktop), androidApp, web (chat, dashboard, docs, marketing).
  Runtime: clients/agent-runtime (Rust, trait-based architecture).

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    tdd: true
    rules:
      - Follow existing code patterns and conventions
      - Load relevant coding skills for the project stack
  verify:
    commands:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test
      - make web-test-all
      - pnpm --dir clients/web check
    rules:
      - Compare implementation against every spec scenario
      - Scope verification commands to the owning workspace when the repository is a monorepo
  archive:
    - Warn before merging destructive deltas (large removals)
