version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # Rust (Agent Runtime)
  - package-ecosystem: "cargo"
    directory: "/clients/agent-runtime"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # Root NPM
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        update-types:
          - "minor"
          - "patch"

  # Web Monorepo (pnpm)
  - package-ecosystem: "npm"
    directory: "/clients/web"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        update-types:
          - "minor"
          - "patch"

  # NPM CLI Wrappers
  - package-ecosystem: "npm"
    directory: "/clients/agent-runtime/npm/corvus-cli"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/clients/agent-runtime/npm/corvus"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        update-types:
          - "minor"
          - "patch"

  # Gradle (Kotlin/Android)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # Docker
  - package-ecosystem: "docker"
    directory: "/clients/agent-runtime"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: "/dev/sandbox"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
