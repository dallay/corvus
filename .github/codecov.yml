# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/codecov.json
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    patch:
      default:
        target: 60%
        threshold: 1%
    project:
      default:
        target: 60%
        threshold: 1%
      # Per-language status checks
      kotlin:
        target: 60%
        threshold: 1%
        flags:
          - kotlin
      rust:
        target: 70%
        threshold: 1%
        flags:
          - rust
ignore:
  - ".*/nocheck/.*"
  - ".*/autogen/.*"
  - ".*/generated/.*"
flags:
  kotlin:
    paths:
      - modules/agent-core-kmp/
      - clients/composeApp/
  rust:
    paths:
      - clients/agent-runtime/
