# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#supported-keywords-for-jobs-that-call-a-reusable-workflow
name: Publish Release

permissions:
  contents: read

on:
  release:
    types:
      - published

jobs:
  resolve-release-scope:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      github.repository == 'dallay/corvus'
    outputs:
      affected_components: ${{ steps.scope.outputs.affected_components }}
      supported_release: ${{ steps.scope.outputs.supported_release }}
    steps:
      - name: 🧭 Resolve release scope from tag
        id: scope
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            rook-v*)
              printf 'affected_components=["rook"]\n' >> "$GITHUB_OUTPUT"
              printf 'supported_release=true\n' >> "$GITHUB_OUTPUT"
              {
                echo "### Release scope"
                echo
                echo "- Tag: \`$RELEASE_TAG\`"
                echo "- Affected components: \`rook\`"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              printf 'affected_components=[]\n' >> "$GITHUB_OUTPUT"
              printf 'supported_release=false\n' >> "$GITHUB_OUTPUT"
              {
                echo "### Release scope"
                echo
                echo "- Tag: \`$RELEASE_TAG\`"
                echo "- This pilot publish workflow only supports the rook component tag namespace."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  publish-release:
    # Canonical stable release handoff: release-please publishes the GitHub Release, then _publish will attach artifacts to the existing canonical GitHub Release.
    needs: resolve-release-scope
    if: ${{ needs.resolve-release-scope.outputs.supported_release == 'true' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_publish.yml
    with:
      release: true
      prerelease: false
      release_tag: ${{ github.event.release.tag_name }}
      release_id: ${{ github.event.release.id }}
      affected_components: ${{ needs.resolve-release-scope.outputs.affected_components }}
    secrets:
      SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
