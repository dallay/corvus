# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync Cargo Lockfiles

on:
  pull_request:
    branches: [main]
    paths:
      - "clients/agent-runtime/Cargo.toml"
      - "clients/cerebro/Cargo.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sync-cargo-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 🔐 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: ✈ Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: 🦀 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}

      - name: 🔁 Sync internal release dependencies
        run: |
          set -euo pipefail
          node scripts/sync-internal-release-deps.mjs --write

      - name: 🔄 Regenerate Cargo.lock files
        run: |
          set -euo pipefail
          echo "Regenerating clients/agent-runtime/Cargo.lock..."
          cargo generate-lockfile --manifest-path clients/agent-runtime/Cargo.toml
          echo "Regenerating clients/cerebro/Cargo.lock..."
          cargo generate-lockfile --manifest-path clients/cerebro/Cargo.toml

      - name: 💾 Commit updated lockfiles
        env:
          SKIP_GIT_HOOKS: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- clients/**/Cargo.toml clients/**/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock files are already up to date"
          else
            git commit -m "chore: sync Cargo.lock files after version bump"
            git push
          fi
