# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "_build-cerebro-binaries"

on:
  workflow_call:

jobs:
  build-cerebro-binaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cerebro-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: cerebro-linux-arm64
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: cerebro-darwin-x64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cerebro-darwin-arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cerebro-windows-x64
            archive_ext: zip

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🦀 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: 🧹 Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: 🛠 Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev

      - name: 🔨 Build binary (Linux)
        if: runner.os == 'Linux'
        working-directory: clients/cerebro
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cerebro

      - name: 🔨 Build binary (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: clients/cerebro
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cerebro

      - name: 🔎 Smoke test built binary (Linux real startup, test-only storage)
        if: runner.os == 'Linux'
        working-directory: clients/cerebro
        env:
          CEREBRO_SMOKE_PORT: "18443"
          CEREBRO_SMOKE_TOKEN: "ci-smoke-token"
        run: |
          set -euo pipefail

          BINARY="./target/${{ matrix.target }}/release/cerebro"
          CONFIG_FILE="$(mktemp cerebro-smoke.XXXXXX.toml)"
          LOG_FILE="$(mktemp cerebro-smoke.XXXXXX.log)"
          MCP_NO_AUTH_RESPONSE="$(mktemp cerebro-smoke-no-auth.XXXXXX.json)"
          MCP_AUTH_RESPONSE="$(mktemp cerebro-smoke-auth.XXXXXX.json)"
          MCP_LIST_REQUEST_FILE="$(mktemp cerebro-smoke-list-request.XXXXXX.json)"
          MCP_CALL_REQUEST_FILE="$(mktemp cerebro-smoke-call-request.XXXXXX.json)"
          PID=""

          cleanup() {
            if [ -n "${PID}" ] && kill -0 "${PID}" 2>/dev/null; then
              kill "${PID}" 2>/dev/null || true
              wait "${PID}" 2>/dev/null || true
            fi
          }

          dump_logs_on_failure() {
            status=$?
            if [ "${status}" -ne 0 ]; then
              echo "::group::Cerebro smoke log"
              if [ -f "${LOG_FILE}" ]; then
                cat "${LOG_FILE}"
              else
                echo "No log file captured"
              fi
              echo "::endgroup::"
            fi
            cleanup
            rm -f "${CONFIG_FILE}" "${LOG_FILE}" "${MCP_NO_AUTH_RESPONSE}" "${MCP_AUTH_RESPONSE}" "${MCP_LIST_REQUEST_FILE}" "${MCP_CALL_REQUEST_FILE}"
            exit "${status}"
          }

          trap dump_logs_on_failure EXIT

          cat > "${CONFIG_FILE}" <<EOF
          host = "127.0.0.1"
          port = ${CEREBRO_SMOKE_PORT}
          auth_token = "${CEREBRO_SMOKE_TOKEN}"
          # CI smoke uses non-durable in_memory only as test scaffolding.
          # Production durable support remains single-node/local-first with
          # embedded_surreal as default and disk as a node-local alternative.
          storage_mode = "in_memory"

          [tui]
          enabled = false
          EOF

          cat > "${MCP_LIST_REQUEST_FILE}" <<'EOF'
          {
            "jsonrpc": "2.0",
            "id": "smoke-tools-list",
            "method": "tools/list"
          }
          EOF

          cat > "${MCP_CALL_REQUEST_FILE}" <<'EOF'
          {
            "jsonrpc": "2.0",
            "id": "smoke-mem-stats",
            "method": "tools/call",
            "params": {
              "name": "mem_stats",
              "arguments": {
                "input": {}
              }
            }
          }
          EOF

          "${BINARY}" serve --config "${CONFIG_FILE}" >"${LOG_FILE}" 2>&1 &
          PID=$!

          for _ in $(seq 1 30); do
            if ! kill -0 "${PID}" 2>/dev/null; then
              echo "Cerebro smoke process exited before becoming healthy"
              exit 1
            fi
            if curl --silent --show-error --fail "http://127.0.0.1:${CEREBRO_SMOKE_PORT}/healthz" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --show-error --fail "http://127.0.0.1:${CEREBRO_SMOKE_PORT}/healthz" | python3 -c 'import json, sys; payload = json.load(sys.stdin); assert payload["status"] == "ok", payload'

          curl --silent --show-error --fail "http://127.0.0.1:${CEREBRO_SMOKE_PORT}/readyz" | python3 -c 'import json, sys; payload = json.load(sys.stdin); assert payload["status"] == "ready", payload'

          curl --silent --show-error \
            -H "Content-Type: application/json" \
            --data @"${MCP_CALL_REQUEST_FILE}" \
            "http://127.0.0.1:${CEREBRO_SMOKE_PORT}/mcp" > "${MCP_NO_AUTH_RESPONSE}"

          python3 - "${MCP_NO_AUTH_RESPONSE}" <<'EOF'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["jsonrpc"] == "2.0", payload
          assert payload.get("id") == "smoke-mem-stats", payload
          assert payload.get("result") is None, payload
          error = payload.get("error")
          assert isinstance(error, dict), payload
          assert error.get("code") == -32001, payload
          EOF

          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${CEREBRO_SMOKE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @"${MCP_LIST_REQUEST_FILE}" \
            "http://127.0.0.1:${CEREBRO_SMOKE_PORT}/mcp" > "${MCP_AUTH_RESPONSE}"

          python3 - "${MCP_AUTH_RESPONSE}" <<'EOF'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["jsonrpc"] == "2.0", payload
          assert payload.get("id") == "smoke-tools-list", payload
          assert payload.get("error") is None, payload
          result = payload.get("result")
          assert isinstance(result, dict), payload
          tools = result.get("tools")
          assert isinstance(tools, list), payload
          EOF

      - name: 🔎 Smoke test built binary (macOS)
        if: runner.os == 'macOS'
        working-directory: clients/cerebro
        run: ./target/${{ matrix.target }}/release/cerebro --help > /dev/null

      - name: 🔎 Smoke test built binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "clients/cerebro/target/${{ matrix.target }}/release/cerebro.exe" --help | Out-Null

      - name: 📦 Package artifact (Unix)
        if: runner.os != 'Windows'
        working-directory: clients/cerebro
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cerebro" "dist/${{ matrix.artifact_name }}"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"

      - name: 📦 Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force -Path clients/cerebro/dist | Out-Null
          Copy-Item "clients/cerebro/target/${{ matrix.target }}/release/cerebro.exe" "clients/cerebro/dist/${{ matrix.artifact_name }}.exe"
          Compress-Archive -Path "clients/cerebro/dist/${{ matrix.artifact_name }}.exe" -DestinationPath "clients/cerebro/dist/${{ matrix.artifact_name }}.zip" -Force

      - name: ⬆ Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: clients/cerebro/dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
