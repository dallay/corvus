# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# https://docs.github.com/en/code-security/how-tos/scan-code-for-vulnerabilities/configure-code-scanning/customizing-your-advanced-setup-for-code-scanning
name: CodeQL Scan

on:
  push:
    branches:
      - main
      - minor
  schedule:
    - cron: "16 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  CodeQL-Scan:
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: wrapper

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: ⚙️ Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: latest
          config-file: ./.github/config/codeql.yml

      - name: 🏗 Build Java/Kotlin with Gradle
        id: gradle_build_java_kotlin
        continue-on-error: true
        if: >
          matrix.build-mode == 'manual' &&
          matrix.language == 'java-kotlin'
        run: ./gradlew clean build

      - name: 🔍 Run CodeQL Analysis (java-kotlin)
        if: >
          steps.gradle_build_java_kotlin.outcome == 'success'
        uses: github/codeql-action/analyze@v4

      - name: 🔍 Run CodeQL Analysis
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/analyze@v4
