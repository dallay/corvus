# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs Quality

on:
  pull_request:
    branches:
      - main
      - minor
      - fix/**
      - feat/**
      - patch/**
    paths:
      - "clients/web/apps/docs/**"
      - "scripts/validate-docs-metadata.mjs"
      - "scripts/model-routing-docs.test.mjs"
      - ".github/workflows/docs-quality.yml"
  push:
    branches:
      - main
    paths:
      - "clients/web/apps/docs/**"
      - "scripts/validate-docs-metadata.mjs"
      - "scripts/model-routing-docs.test.mjs"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-quality:
    name: Validate docs metadata and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/web/apps/docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate documentation metadata
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node ../../../../scripts/validate-docs-metadata.mjs

      - name: Validate model routing docs
        working-directory: .
        run: node scripts/model-routing-docs.test.mjs

      - name: Run docs checks
        run: pnpm run check

      - name: Build docs site
        run: pnpm run build

      - name: Upload docs preview artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-${{ github.run_id }}
          path: clients/web/apps/docs/dist
          retention-days: 7

      - name: Summarize preview artifact
        if: success()
        run: |
          {
            echo "## Docs preview artifact"
            echo ""
            echo "Preview site bundle uploaded as artifact: \`docs-preview-${{ github.run_id }}\`"
            echo "Download it from the workflow run artifacts to inspect unreleased docs safely."
          } >> "$GITHUB_STEP_SUMMARY"
