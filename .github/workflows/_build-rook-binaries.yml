# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "_build-rook-binaries"

on:
  workflow_call:

jobs:
  build-rook-binaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rook-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: rook-linux-arm64
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rook-darwin-x64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rook-darwin-arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rook-windows-x64
            archive_ext: zip

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🦀 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: 🛠 Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev

      - name: 🔨 Build binary
        working-directory: clients/rook
        run: cargo build --release --locked --target ${{ matrix.target }} --bin rook

      - name: 📦 Package artifact (Unix)
        if: runner.os != 'Windows'
        working-directory: clients/rook
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rook" "dist/${{ matrix.artifact_name }}"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"

      - name: 📦 Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clients/rook/dist | Out-Null
          Copy-Item "clients/rook/target/${{ matrix.target }}/release/rook.exe" "clients/rook/dist/${{ matrix.artifact_name }}.exe"
          Compress-Archive -Path "clients/rook/dist/${{ matrix.artifact_name }}.exe" -DestinationPath "clients/rook/dist/${{ matrix.artifact_name }}.zip" -Force

      - name: ⬆ Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: clients/rook/dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
