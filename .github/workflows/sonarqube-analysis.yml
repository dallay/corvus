# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - minor
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_ORGANIZATION: dallay

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: ℹ️ SONAR_TOKEN missing
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured. Skipping SonarQube scan and quality gate."

      - name: ☕ Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 📦 Setup Node
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"

      - name: 🐘 Setup Gradle
        if: env.SONAR_TOKEN != ''
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: wrapper

      - name: 🔧 Make Gradle wrapper executable
        if: env.SONAR_TOKEN != ''
        run: chmod +x ./gradlew

      - name: 🧪 Build and generate coverage
        if: env.SONAR_TOKEN != ''
        run: ./gradlew test jvmTest :agent-core-kmp:koverXmlReport :composeApp:koverXmlReport

      - name: 🦀 Setup Rust
        if: env.SONAR_TOKEN != ''
        uses: dtolnay/rust-toolchain@HEAD
        with:
          toolchain: 1.92

      - name: 📦 Install cargo-llvm-cov
        if: env.SONAR_TOKEN != ''
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 🧪 Generate Rust coverage
        if: env.SONAR_TOKEN != ''
        working-directory: clients/agent-runtime
        run: cargo llvm-cov --cobertura --output-path ../../coverage/agent-runtime-coverage.xml

      - name: 🧮 Compute Sonar project key
        if: env.SONAR_TOKEN != ''
        id: sonar_meta
        shell: bash
        run: echo "key=${GITHUB_REPOSITORY//\//_}" >> "$GITHUB_OUTPUT"

      - name: 🔍 SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ steps.sonar_meta.outputs.key }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.git/**,**/.gradle/**,**/build/**,**/dist/**,**/coverage/**,**/node_modules/**,**/.next/**,**/.turbo/**,**/target/**,**/vendor/**,**/generated/**,**/clients/agent-runtime/target/**
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/coverage/agent-runtime-coverage.xml,${{ github.workspace }}/modules/agent-core-kmp/build/reports/kover/report.xml,${{ github.workspace }}/clients/composeApp/build/reports/kover/report.xml

      - name: 🚦 SonarQube Quality Gate
        if: >-
          env.SONAR_TOKEN != '' &&
          (
            github.event_name == 'pull_request' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          pollingTimeoutSec: 300
