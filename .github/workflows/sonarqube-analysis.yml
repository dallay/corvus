# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - minor
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_ORGANIZATION: dallay

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: ℹ️ SONAR_TOKEN missing
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured. Skipping SonarQube scan and quality gate."

      - name: ☕ Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 📦 Setup Node
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: 🐘 Setup Gradle
        if: env.SONAR_TOKEN != ''
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: wrapper

      - name: 🔧 Make Gradle wrapper executable
        if: env.SONAR_TOKEN != ''
        run: chmod +x ./gradlew

      - name: 🧪 Build and generate coverage
        if: env.SONAR_TOKEN != ''
        run: ./gradlew test jvmTest :agent-core-kmp:koverXmlReport :composeApp:koverXmlReport

      - name: 🦀 Setup Rust
        if: env.SONAR_TOKEN != ''
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # HEAD as of 2026-03-04
        with:
          toolchain: 1.92

      - name: 📦 Install cargo-llvm-cov
        if: env.SONAR_TOKEN != ''
        uses: taiki-e/install-action@2834d6555cea49e0759c35c2a877ea0228e73e06 # cargo-llvm-cov

      - name: 📁 Create coverage directory
        if: env.SONAR_TOKEN != ''
        run: mkdir -p coverage

      - name: 🧪 Generate Rust coverage
        if: env.SONAR_TOKEN != ''
        working-directory: clients/agent-runtime
        run: cargo llvm-cov --lcov --output-path ../../coverage/agent-runtime-coverage.lcov

      - name: 🧮 Compute Sonar project key
        if: env.SONAR_TOKEN != ''
        id: sonar_meta
        shell: bash
        run: echo "key=${GITHUB_REPOSITORY//\//_}" >> "$GITHUB_OUTPUT"

      - name: 🔍 SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ steps.sonar_meta.outputs.key }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*_test.rs,**/tests/**,**/src/test/**,**/src/commonTest/**,**/src/jvmTest/**,**/src/androidUnitTest/**,**/src/iosTest/**
            -Dsonar.exclusions=**/.git/**,**/.gradle/**,**/build/**,**/dist/**,**/coverage/**,**/node_modules/**,**/.next/**,**/.turbo/**,**/target/**,**/vendor/**,**/generated/**,**/clients/agent-runtime/target/**
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,clients/web/apps/dashboard/src/App.vue,clients/web/packages/shared/index.ts,clients/agent-runtime/npm/corvus-cli/scripts/postinstall.mjs,clients/agent-runtime/npm/corvus-cli/lib/install.js,gradle/build-logic/src/main/kotlin/**,clients/composeApp/src/**,clients/iosApp/**,clients/web/apps/*/src/main.ts,clients/web/apps/*/src/i18n.ts,clients/web/apps/docs/src/content.config.ts,clients/web/apps/docs/astro.config.mjs,clients/web/apps/marketing/astro.config.mjs,clients/web/apps/chat/vite.config.ts,clients/web/apps/chat/tsconfig.node.json,clients/web/apps/dashboard/tsconfig.node.json,clients/web/packages/locales/src/index.ts,clients/agent-runtime/firmware/**,clients/agent-runtime/examples/**
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S100
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.kt
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/modules/agent-core-kmp/build/reports/kover/report.xml,${{ github.workspace }}/clients/composeApp/build/reports/kover/report.xml
            -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/coverage/agent-runtime-coverage.lcov
            -Dsonar.python.version=3.12
            -Dsonar.typescript.node=${{ github.workspace }}/clients/web/node_modules

      - name: 🚦 SonarQube Quality Gate
        if: >-
          env.SONAR_TOKEN != '' &&
          (
            github.event_name == 'pull_request' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
