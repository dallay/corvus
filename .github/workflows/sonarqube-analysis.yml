# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - minor
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_ORGANIZATION: dallay

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: ❌ SONAR_TOKEN missing
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not configured. SonarQube analysis is required for this workflow." >&2
          echo "Configure the SONAR_TOKEN repository secret or disable the workflow until SonarCloud is provisioned." >&2
          exit 1

      - name: ☕ Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 📦 Setup pnpm
        if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: 📦 Install web dependencies
        if: env.SONAR_TOKEN != ''
        working-directory: clients/web
        run: pnpm install --frozen-lockfile

      - name: 🐘 Setup Gradle
        if: env.SONAR_TOKEN != ''
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: wrapper

      - name: 🔧 Make Gradle wrapper executable
        if: env.SONAR_TOKEN != ''
        run: chmod +x ./gradlew

      - name: 🧪 Build and generate coverage
        if: env.SONAR_TOKEN != ''
        run: ./gradlew test jvmTest :agent-core-kmp:koverXmlReport :composeApp:koverXmlReport

      - name: 🧪 Generate web app coverage
        if: env.SONAR_TOKEN != ''
        working-directory: clients/web
        run: |
          cd apps/dashboard
          pnpm exec vitest --run --environment happy-dom --exclude "e2e/**" --coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: 🦀 Setup Rust
        if: env.SONAR_TOKEN != ''
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # HEAD as of 2026-03-04
        with:
          toolchain: 1.92

      - name: 📦 Install cargo-llvm-cov
        if: env.SONAR_TOKEN != ''
        uses: taiki-e/install-action@2dc1234c293fde032a8e34c74501c7d6403e92ae # cargo-llvm-cov

      - name: 📁 Create coverage directory
        if: env.SONAR_TOKEN != ''
        run: mkdir -p coverage

      - name: 🧪 Generate Rust coverage
        if: env.SONAR_TOKEN != ''
        working-directory: clients/agent-runtime
        run: cargo llvm-cov --lcov --output-path ../../coverage/agent-runtime-coverage.lcov

      - name: 🧮 Compute Sonar project key
        if: env.SONAR_TOKEN != ''
        id: sonar_meta
        shell: bash
        run: echo "key=${GITHUB_REPOSITORY//\//_}" >> "$GITHUB_OUTPUT"

      - name: 🔍 SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ steps.sonar_meta.outputs.key }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*_test.rs,**/tests/**,**/src/test/**,**/src/commonTest/**,**/src/jvmTest/**,**/src/androidUnitTest/**,**/src/iosTest/**
            -Dsonar.exclusions=**/.git/**,**/.gradle/**,**/build/**,**/dist/**,**/coverage/**,**/node_modules/**,**/.next/**,**/.turbo/**,**/target/**,**/vendor/**,**/generated/**,**/clients/agent-runtime/target/**,**/clients/agent-runtime/crates/**/Cargo.toml,**/clients/agent-runtime/firmware/**/Cargo.toml
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,scripts/**,clients/web/apps/dashboard/src/App.vue,clients/web/packages/shared/index.ts,clients/agent-runtime/npm/corvus-cli/scripts/postinstall.mjs,clients/agent-runtime/npm/corvus-cli/lib/install.js,gradle/build-logic/src/main/kotlin/**,clients/composeApp/src/**,clients/iosApp/**,clients/web/apps/*/src/main.ts,clients/web/apps/*/src/i18n.ts,clients/web/apps/docs/src/content.config.ts,clients/web/apps/docs/astro.config.mjs,clients/web/apps/marketing/astro.config.mjs,clients/web/apps/dashboard/tsconfig.node.json,clients/web/packages/locales/src/index.ts,clients/agent-runtime/firmware/**,clients/agent-runtime/examples/**
            -Dsonar.cpd.exclusions=**/content/docs/**/*.md,**/content/docs/**/*.mdx
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S100
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.kt
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/modules/agent-core-kmp/build/reports/kover/report.xml,${{ github.workspace }}/clients/composeApp/build/reports/kover/report.xml
            -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/coverage/agent-runtime-coverage.lcov
            -Dsonar.javascript.lcov.reportPaths=${{ github.workspace }}/clients/web/apps/dashboard/coverage/lcov.info
            -Dsonar.python.version=3.12
            -Dsonar.typescript.node=${{ github.workspace }}/clients/web/node_modules

      - name: 🚦 SonarQube Quality Gate
        if: >-
          env.SONAR_TOKEN != '' &&
          (
            github.event_name == 'pull_request' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
