# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - minor
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_ORGANIZATION: dallay

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: ℹ️ SONAR_TOKEN missing
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured. Skipping SonarQube scan and quality gate."

      - name: ☕ Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 📦 Setup pnpm
        if: env.SONAR_TOKEN != ''
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.0.0
        with:
          version: "10.30.1"

      - name: 📦 Setup Node
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📦 Install root dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --ignore-scripts

      - name: 📦 Install web dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm -C clients/web install --ignore-scripts

      - name: 🐘 Setup Gradle
        if: env.SONAR_TOKEN != ''
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: wrapper

      - name: 🔧 Make Gradle wrapper executable
        if: env.SONAR_TOKEN != ''
        run: chmod +x ./gradlew

      - name: 🧪 Build and generate coverage
        if: env.SONAR_TOKEN != ''
        run: ./gradlew test jvmTest lintDebug :agent-core-kmp:koverXmlReport :composeApp:koverXmlReport

      - name: 🦀 Setup Rust
        if: env.SONAR_TOKEN != ''
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # HEAD as of 2026-03-04
        with:
          toolchain: 1.92

      - name: 📦 Install cargo-llvm-cov
        if: env.SONAR_TOKEN != ''
        uses: taiki-e/install-action@2834d6555cea49e0759c35c2a877ea0228e73e06 # cargo-llvm-cov

      - name: 📁 Create coverage directory
        if: env.SONAR_TOKEN != ''
        run: mkdir -p coverage

      - name: 🧪 Generate Rust coverage
        if: env.SONAR_TOKEN != ''
        working-directory: clients/agent-runtime
        run: cargo llvm-cov --lcov --output-path ../../coverage/agent-runtime-coverage.lcov

      - name: 🎨 Run Stylelint
        if: env.SONAR_TOKEN != ''
        run: pnpm -C clients/web run lint:style -f json -o ../../coverage/stylelint-report.json

      - name: 🐳 Run Hadolint
        if: env.SONAR_TOKEN != ''
        run: |
          hadolint_version="v2.12.0"
          curl -sSL --proto '=https' --tlsv1.2 "https://github.com/hadolint/hadolint/releases/download/${hadolint_version}/hadolint-Linux-x86_64" -o hadolint
          chmod +x hadolint
          find . -name "Dockerfile*" -not -path "*/node_modules/*" -print0 | xargs -0 ./hadolint -f json > coverage/hadolint-report.json || true
          rm hadolint

      - name: 🤖 Run Actionlint
        if: env.SONAR_TOKEN != ''
        run: |
          actionlint_version="1.7.7"
          curl -sSL --proto '=https' --tlsv1.2 "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz
          ./actionlint -format '{{json .}}' .github/workflows/*.yml > coverage/actionlint-report.json || true
          rm actionlint actionlint.tar.gz

      - name: 🧮 Compute Sonar project key
        if: env.SONAR_TOKEN != ''
        id: sonar_meta
        shell: bash
        run: echo "key=${GITHUB_REPOSITORY//\//_}" >> "$GITHUB_OUTPUT"

      - name: 🎚️ Temporarily relax new coverage gate to 70%
        if: env.SONAR_TOKEN != '' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://sonarcloud.io/api"
          project_key="${{ steps.sonar_meta.outputs.key }}"
          organization="${SONAR_ORGANIZATION}"
          custom_gate_name="Corvus PR Gate"

          api_get() {
            local endpoint="$1"
            local output="$2"
            local query_args="$3"
            local status
            status=$(curl -sS -u "${SONAR_TOKEN}:" --get \
              --write-out "%{http_code}" \
              --output "${output}" \
              ${query_args} \
              "${api_base}/${endpoint}")
            if [[ "${status}" != "200" ]]; then
              echo "::error::Sonar API GET ${endpoint} failed with HTTP ${status}"
              cat "${output}" || true
              return 1
            fi
          }

          api_post() {
            local endpoint="$1"
            shift
            local status
            status=$(curl -sS -u "${SONAR_TOKEN}:" -X POST \
              --write-out "%{http_code}" \
              --output api-post.json \
              "$@" \
              "${api_base}/${endpoint}")
            if [[ "${status}" != "200" && "${status}" != "204" ]]; then
              echo "::error::Sonar API POST ${endpoint} failed with HTTP ${status}"
              cat api-post.json || true
              return 1
            fi
          }

          echo "Resolving quality gate for project: ${project_key}"
          api_get \
            "qualitygates/get_by_project" \
            gate-project.json \
            "--data-urlencode organization=${organization} --data-urlencode project=${project_key}"

          gate_id=$(python - <<'PY'
          import json
          import sys

          with open("gate-project.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          gate = data.get("qualityGate") or {}
          gate_id = gate.get("id")

          if gate_id is None:
              sys.stderr.write("Could not resolve quality gate id from get_by_project response\n")
              sys.exit(1)

          print(gate_id)
          PY
          )

          gate_meta=$(python - <<'PY'
          import json

          with open("gate-project.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          gate = data.get("qualityGate") or {}
          name = gate.get("name", "")
          is_built_in = gate.get("isBuiltIn", False)
          print(f"{name}|{str(is_built_in).lower()}")
          PY
          )
          current_gate_name="${gate_meta%%|*}"
          current_gate_builtin="${gate_meta##*|}"

          if [[ "${current_gate_builtin}" == "true" || "${current_gate_name}" == "Sonar way" ]]; then
            echo "Current gate '${current_gate_name}' is built-in; switching project to '${custom_gate_name}'"

            create_status=$(curl -sS -u "${SONAR_TOKEN}:" -X POST \
              --write-out "%{http_code}" \
              --output gate-create.json \
              --data-urlencode "organization=${organization}" \
              --data-urlencode "name=${custom_gate_name}" \
              "${api_base}/qualitygates/create")
            if [[ "${create_status}" != "200" && "${create_status}" != "204" ]]; then
              if ! grep -qi "already exists" gate-create.json; then
                echo "::error::Unable to create custom quality gate (${create_status})"
                cat gate-create.json || true
                exit 1
              fi
            fi

            api_get \
              "qualitygates/list" \
              gate-list.json \
              "--data-urlencode organization=${organization}"

            custom_gate_id=$(CUSTOM_GATE_NAME="${custom_gate_name}" python - <<'PY'
          import json
          import os
          import sys

          name = os.environ["CUSTOM_GATE_NAME"]
          with open("gate-list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          gate = next((g for g in data.get("qualitygates", []) if g.get("name") == name), None)
          if not gate or gate.get("id") is None:
              sys.stderr.write(f"Could not resolve gate id for '{name}'\n")
              sys.exit(1)

          print(gate["id"])
          PY
            )

            api_post "qualitygates/select" \
              --data-urlencode "organization=${organization}" \
              --data-urlencode "projectKey=${project_key}" \
              --data-urlencode "gateId=${custom_gate_id}"

            api_get \
              "qualitygates/get_by_project" \
              gate-project.json \
              "--data-urlencode organization=${organization} --data-urlencode project=${project_key}"

          gate_id=$(python - <<'PY'
          import json
          import sys

          with open("gate-project.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          gate = data.get("qualityGate") or {}
          gate_id = gate.get("id")

          if gate_id is None:
              sys.stderr.write("Could not resolve quality gate id after selecting custom gate\n")
              sys.exit(1)

          print(gate_id)
          PY
          )
          fi

          echo "Project quality gate id: ${gate_id}"
          api_get \
            "qualitygates/show" \
            gate.json \
            "--data-urlencode organization=${organization} --data-urlencode id=${gate_id}"

          condition_id=$(python - <<'PY'
          import json
          import sys

          with open("gate.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          condition = next(
              (c for c in data.get("conditions", []) if c.get("metric") == "new_coverage"),
              None,
          )

          if not condition:
              print("")
              sys.exit(0)

          print(condition.get("id", ""))
          PY
          )

          if [[ -n "${condition_id}" ]]; then
            echo "Updating existing new_coverage condition to 70"
            api_post "qualitygates/update_condition" \
              --data-urlencode "organization=${organization}" \
              --data-urlencode "id=${condition_id}" \
              --data-urlencode "metric=new_coverage" \
              --data-urlencode "op=LT" \
              --data-urlencode "error=70"
          else
            echo "Creating new_coverage condition with threshold 70"
            api_post "qualitygates/create_condition" \
              --data-urlencode "organization=${organization}" \
              --data-urlencode "gateId=${gate_id}" \
              --data-urlencode "metric=new_coverage" \
              --data-urlencode "op=LT" \
              --data-urlencode "error=70"
          fi

          api_get \
            "qualitygates/show" \
            gate-after.json \
            "--data-urlencode organization=${organization} --data-urlencode id=${gate_id}"

          python - <<'PY'
          import json
          import sys

          with open("gate-after.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          condition = next(
              (c for c in data.get("conditions", []) if c.get("metric") == "new_coverage"),
              None,
          )

          if not condition:
              sys.stderr.write("new_coverage condition missing after update\n")
              sys.exit(1)

          error = str(condition.get("error", ""))
          if error != "70":
              sys.stderr.write(f"new_coverage threshold verification failed: expected 70, got {error}\n")
              sys.exit(1)

          print("Verified new_coverage threshold = 70")
          PY

      - name: 🔍 SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ steps.sonar_meta.outputs.key }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*_test.rs,**/tests/**,**/src/test/**,**/src/commonTest/**,**/src/jvmTest/**,**/src/androidUnitTest/**,**/src/iosTest/**
            -Dsonar.exclusions=**/.git/**,**/.gradle/**,**/build/**,**/dist/**,**/coverage/**,**/node_modules/**,**/.next/**,**/.turbo/**,**/target/**,**/vendor/**,**/generated/**,**/clients/agent-runtime/target/**
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,clients/web/apps/dashboard/src/App.vue,clients/web/packages/shared/index.ts,clients/agent-runtime/npm/corvus-cli/scripts/postinstall.js,clients/agent-runtime/npm/corvus-cli/lib/install.js,gradle/build-logic/src/main/kotlin/**,clients/composeApp/src/**,clients/iosApp/**,clients/web/apps/*/src/main.ts,clients/web/apps/*/src/i18n.ts,clients/web/apps/docs/src/content.config.ts,clients/web/apps/docs/astro.config.mjs,clients/web/apps/marketing/astro.config.mjs,clients/web/packages/locales/src/index.ts,clients/agent-runtime/firmware/**,clients/agent-runtime/examples/**
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S100
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.kt
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/modules/agent-core-kmp/build/reports/kover/report.xml,${{ github.workspace }}/clients/composeApp/build/reports/kover/report.xml
            -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/coverage/agent-runtime-coverage.lcov
            -Dsonar.css.stylelint.reportPaths=coverage/stylelint-report.json
            -Dsonar.androidLint.reportPaths=**/build/reports/lint-results-*.xml
            -Dsonar.docker.hadolint.reportPaths=coverage/hadolint-report.json
            -Dsonar.githubactions.actionlint.reportPaths=coverage/actionlint-report.json
            -Dsonar.python.version=3.12
            -Dsonar.typescript.node=${{ github.workspace }}/clients/web/node_modules

      - name: 🚦 SonarQube Quality Gate (PR advisory)
        if: env.SONAR_TOKEN != '' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: 🚦 SonarQube Quality Gate (main enforced)
        if: env.SONAR_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
