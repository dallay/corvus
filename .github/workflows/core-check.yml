# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Core Checks

on:
  push:
    branches:
      - main
      - minor
    paths:
      - "modules/agent-core-kmp/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "clients/agent-runtime/rust-toolchain.toml"
      - ".github/workflows/core-check.yml"
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
      - fix/**
      - feat/**
      - patch/**
    paths:
      - "modules/agent-core-kmp/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "clients/agent-runtime/rust-toolchain.toml"
      - ".github/workflows/core-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: ✈ Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: ☕ Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🧭 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          toolchain = data.get("toolchain", {})
          channel = toolchain.get("channel")
          components = ",".join(toolchain.get("components", []))
          targets = ",".join(toolchain.get("targets", []))
          profile = toolchain.get("profile", "")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")
              output.write(f"components={components}\n")
              output.write(f"targets={targets}\n")
              output.write(f"profile={profile}\n")

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: ${{ steps.rust-channel.outputs.components }}
          targets: ${{ steps.rust-channel.outputs.targets }}

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🦀 Verify Rust toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: ✅ Run core checks
        shell: bash
        run: |
          PATH="$HOME/.cargo/bin:$PATH" ./gradlew :agent-core-kmp:check
