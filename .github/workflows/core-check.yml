# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Core Checks

on:
  push:
    branches:
      - main
      - minor
    paths:
      - "modules/agent-core-kmp/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "clients/agent-runtime/rust-toolchain.toml"
      - ".github/workflows/core-check.yml"
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
      - fix/**
      - feat/**
      - patch/**
    paths:
      - "modules/agent-core-kmp/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "clients/agent-runtime/rust-toolchain.toml"
      - ".github/workflows/core-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: ✈ Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🧭 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🦀 Verify Rust toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: ✅ Run core checks
        shell: bash
        run: |
          PATH="$HOME/.cargo/bin:$PATH" ./gradlew :agent-core-kmp:check
