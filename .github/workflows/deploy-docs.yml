name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      docs_ref:
        description: "Tag, branch, or commit SHA to publish as the stable docs site"
        required: true
        default: "main"

concurrency:
  group: pages-${{ inputs.docs_ref || github.ref }}
  cancel-in-progress: true

# Default permissions for the workflow
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    if: github.repository == 'dallay/corvus'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web/apps/docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.docs_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: clients/web/apps/docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: clients/web/apps/docs/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
