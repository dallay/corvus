name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      docs_ref:
        description: "Tag, branch, or commit SHA to publish as the stable docs site"
        required: true
        default: "main"

concurrency:
  group: pages-${{ inputs.docs_ref || github.ref }}
  cancel-in-progress: true

# Default permissions for the workflow
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    if: github.repository == 'dallay/corvus'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web/apps/docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.docs_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: clients/web/apps/docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: clients/web/apps/docs/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
