# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Checks Build Logic

on:
  push:
    branches:
      - main
      - minor
    paths:
      - "gradle/*.toml"
      - "gradle/build-logic/**"
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
      - fix/**
      - feat/**
      - patch/**
    paths:
      - "gradle/*.toml"
      - "gradle/build-logic/**"
  workflow_dispatch:

concurrency:
  # see: https://stackoverflow.com/a/72408109/30654190
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-checks-build-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: ✈ Checkout default branch
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 📦 Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: ☕ Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      #      - name: 🦆 Run Actionlint
      #        run: ./gradlew runActionlint

      - name: 🔧 Check build-logic workspace
        id: check_build_logic
        continue-on-error: true
        run: ./gradlew -p "gradle/build-logic" help

      - name: 🔒 Check build-logic locks
        if: >
          steps.check_build_logic.outcome == 'success' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        run: ./gradlew -p "gradle/build-logic" checkLocks

      - name: ✅ Run build checks
        if: steps.check_build_logic.outcome == 'success'
        run: ./gradlew -p "gradle/build-logic" check
