# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Checks

on:
  push:
    branches:
      - main
      - minor
    tags:
      - "!**"
  pull_request:
    branches:
      - main
      - minor
      - fix/**
      - feat/**
      - patch/**
  merge_group:
    branches:
      - main
      - minor
  workflow_dispatch:

concurrency:
  # see: https://stackoverflow.com/a/72408109/30654190
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: ✈ Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: ✏ Validate commit messages
        if: >
          github.event_name != 'merge_group' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        run: |
          chmod +x .github/workflows/shell/check-commit-msg.sh
          .github/workflows/shell/check-commit-msg.sh

      #      - name: 🔀 Merge target branch into PR branch
      #        if: github.event_name == 'pull_request' || github.event_name == 'issue_comment'
      #        run: |
      #          git fetch origin ${{ github.base_ref }}:target-branch
      #          git merge --no-ff target-branch

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            clients/web/pnpm-lock.yaml
            clients/web/apps/docs/pnpm-lock.yaml
            clients/web/apps/marketing/pnpm-lock.yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🦀 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy

      #      - name: 🦆 Run Actionlint
      #        run: ./gradlew runActionlint

      - name: 🔒 Check locks
        if: >
          github.event_name != 'merge_group' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        run: ./gradlew checkLocksAll --no-parallel

      - name: 🔍 Check internal release dependency sync
        if: >
          github.event_name != 'merge_group' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        run: node scripts/sync-internal-release-deps.mjs --check

      - name: 🦀 Check Rust lockfiles are up to date
        if: >
          github.event_name != 'merge_group' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        run: |
          set -euo pipefail
          # cargo metadata --locked fails fast if Cargo.lock is stale, without compiling.
          cargo metadata --manifest-path clients/agent-runtime/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path clients/cerebro/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
          echo "✅ All Cargo.lock files are consistent with their Cargo.toml"

      - name: 🧹 Fmt Cerebro crate
        run: cargo fmt --manifest-path clients/cerebro/Cargo.toml --all -- --check

      - name: 🧭 Clippy Cerebro crate
        run: cargo clippy --manifest-path clients/cerebro/Cargo.toml --all-targets -- -D warnings

      - name: 🦀 Check Cerebro crate
        run: cargo check --manifest-path clients/cerebro/Cargo.toml --locked

      - name: 🧪 Test Cerebro crate
        run: cargo test --manifest-path clients/cerebro/Cargo.toml --locked

      - name: 🏗 Run main checks
        run: ./gradlew check

      - name: 🛠 Generate CycloneDX BOM
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: ./gradlew cyclonedxBom --no-configuration-cache

      - name: 📈 Generate Code Coverage Report
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: ./gradlew testCodeCoverageReport testCoverageAllWebApps

      - name: 📤 Upload Kotlin/Rust coverage to Codecov
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          verbose: true
          flags: rust,kotlin
          files: ./gradle/aggregation/build/reports/coverage/coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 📤 Upload Web coverage to Codecov
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          verbose: true
          flags: web
          directory: ./clients/web/apps
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
