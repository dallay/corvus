# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Dependency Scan

on:
  schedule:
    - cron: "0 5 * * *" # Daily at 05:00 UTC
  push:
    branches:
      - main
      - minor
  workflow_dispatch:

jobs:
  rust-audit:
    name: Rust Security Audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-runtime
            manifest-path: clients/agent-runtime/Cargo.toml
          - name: corvus-nucleo
            manifest-path: clients/agent-runtime/firmware/corvus-nucleo/Cargo.toml
          - name: corvus-esp32
            manifest-path: clients/agent-runtime/firmware/corvus-esp32/Cargo.toml
          - name: corvus-esp32-ui
            manifest-path: clients/agent-runtime/firmware/corvus-esp32-ui/Cargo.toml
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: 📥 Install cargo-deny
        uses: taiki-e/install-action@2dc1234c293fde032a8e34c74501c7d6403e92ae # v2.68.14
        with:
          tool: cargo-deny

      - name: 🔍 Run cargo-deny
        run: cargo-deny check advisories --config clients/agent-runtime/deny.toml --manifest-path "${{ matrix.manifest-path }}"

  kotlin-dependency-submission:
    name: Kotlin Dependency Submission
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: 🐘 Submit Dependency Graph
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: wrapper
