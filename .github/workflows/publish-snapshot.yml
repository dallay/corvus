# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "12 2 * * *"

concurrency:
  group: publish-snapshot-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-snapshot:
    # Snapshots stay outside stable GitHub Release ownership and release-note publication.
    if: github.repository == 'dallay/corvus'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish.yml
    with:
      # Snapshot runs only cover the Gradle/Maven channel.
      release: false
    secrets:
      SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
