# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Auto Fix Lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-fix-lockfile:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ✈ Checkout default branch
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            clients/web/pnpm-lock.yaml
            clients/web/apps/docs/pnpm-lock.yaml
            clients/web/apps/marketing/pnpm-lock.yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🦀 Setup Rust toolchain
        run: rustup toolchain install 1.92 --profile minimal --component rustfmt --component clippy

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🔒 Write all Gradle locks
        run: ./gradlew writeLocksAll --no-parallel

      - name: 💾 Commit file changes (auto)
        id: auto-pr-lockfile
        env:
          SKIP_GIT_HOOKS: "1"
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto-pr/fix-lockfile"
          commit-message: "chore: auto fix lockfile [skip ci].."
          title: "chore: auto fix lockfile [skip ci].."
          labels: |
            pr|chore
          body: |
            ## Summary

            This PR fixes the lockfile.

      - name: 🔧 Show PR info
        env:
          PR_INFO: ${{ toJSON(steps.auto-pr-lockfile.outputs) }}
        run: |
          echo "PR info: $PR_INFO"
