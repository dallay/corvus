# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Auto Fix Lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-fix-lockfile:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ✈ Checkout default branch
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            clients/web/pnpm-lock.yaml
            clients/web/apps/docs/pnpm-lock.yaml
            clients/web/apps/marketing/pnpm-lock.yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🦀 Setup Rust toolchain
        run: rustup toolchain install 1.92 --profile minimal --component rustfmt --component clippy

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🔒 Write all Gradle locks
        run: ./gradlew writeLocksAll --no-parallel

      - name: 💾 Commit file changes (auto)
        id: auto-pr-lockfile
        env:
          SKIP_GIT_HOOKS: "1"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto-pr/fix-lockfile"
          commit-message: "chore: auto fix lockfile [skip ci].."
          title: "chore: auto fix lockfile [skip ci].."
          labels: |
            pr|chore
          body: |
            ## Summary

            This PR fixes the lockfile.

      - name: 🔧 Show PR info
        env:
          PR_INFO: ${{ toJSON(steps.auto-pr-lockfile.outputs) }}
        run: |
          echo "PR info: $PR_INFO"
