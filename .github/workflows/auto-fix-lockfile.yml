# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Auto Fix Lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-fix-lockfile:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ✈ Checkout default branch
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            clients/web/pnpm-lock.yaml
            clients/web/apps/docs/pnpm-lock.yaml
            clients/web/apps/marketing/pnpm-lock.yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🦀 Setup Rust toolchain
        run: rustup toolchain install 1.92 --profile minimal --component rustfmt --component clippy

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🔒 Write all Gradle locks
        run: ./gradlew writeLocksAll --no-parallel

      - name: 💾 Commit file changes (auto)
        id: auto-pr-lockfile
        env:
          SKIP_GIT_HOOKS: "1"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto-pr/fix-lockfile"
          commit-message: "chore: auto fix lockfile [skip ci].."
          title: "chore: auto fix lockfile [skip ci].."
          labels: |
            pr|chore
          body: |
            ## Summary

            This PR fixes the lockfile.

      - name: 🔧 Show PR info
        env:
          PR_INFO: ${{ toJSON(steps.auto-pr-lockfile.outputs) }}
        run: |
          echo "PR info: $PR_INFO"
