# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release-please.outputs.releases_created || steps.release-please.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      release_id: ${{ steps.resolve-release-id.outputs.release_id }}
      affected_components: ${{ steps.component-scope.outputs.affected_components }}
    steps:
      - name: 🔐 Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 📥 Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🧭 Resolve affected components
        id: component-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RESOLVER_OUTPUT: ${{ runner.temp }}/release-components.json
        run: |
          set -euo pipefail
          node scripts/resolve-release-components.mjs > "$RESOLVER_OUTPUT"
          python3 <<'PY'
          import json
          import os
          import pathlib

          resolver_output = pathlib.Path(os.environ["RESOLVER_OUTPUT"])
          payload = json.loads(resolver_output.read_text(encoding="utf-8"))
          affected = payload["affected_components"]
          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write("affected_components=" + json.dumps(affected) + "\n")

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write("### Affected components\n\n")
              fh.write("- Resolver: `node scripts/resolve-release-components.mjs`\n")
              fh.write(f"- Components: `{', '.join(affected)}`\n")
              if payload["changed_files"]:
                  fh.write("- Changed files considered:\n")
                  for path in payload["changed_files"]:
                      fh.write(f"  - `{path}`\n")
              if payload["non_release_paths"]:
                  fh.write("- Non-release paths:\n")
                  for path in payload["non_release_paths"]:
                      fh.write(f"  - `{path}`\n")
              if payload["transitive_components"]:
                  fh.write(f"- Transitive components: `{', '.join(payload['transitive_components'])}`\n")
          PY

      - name: 🤖 Run release-please
        id: release-please
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          fork: false

      - name: 🔁 Sync internal release dependencies
        run: |
          set -euo pipefail
          node scripts/sync-internal-release-deps.mjs --write

      - name: 🧾 Resolve GitHub Release id
        if: ${{ steps.release-please.outputs.releases_created == 'true' || steps.release-please.outputs.release_created == 'true' }}
        id: resolve-release-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_id=""
          max_attempts=5
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null || true)"
            if [ -n "$release_id" ]; then
              break
            fi
            if [ $attempt -lt $max_attempts ]; then
              sleep_seconds=$((attempt * 2))
              echo "Attempt $attempt failed, retrying in ${sleep_seconds}s..."
              sleep $sleep_seconds
            fi
          done
          if [ -z "$release_id" ]; then
            echo "::error::Failed to resolve release id for tag ${RELEASE_TAG} after ${max_attempts} attempts"
            exit 1
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: 📄 Summarize release-please outcome
        if: ${{ always() }}
        env:
          RELEASE_PLEASE_OUTPUTS: ${{ toJson(steps.release-please.outputs) }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          outputs = json.loads(os.environ.get("RELEASE_PLEASE_OUTPUTS") or "{}")
          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))
          manifest_version = manifest.get(".", "unknown")

          version = outputs.get("version") or "not emitted"
          tag_name = outputs.get("tag_name") or "not emitted"
          releases_created = outputs.get("releases_created") or outputs.get("release_created") or "false"
          prs_created = outputs.get("prs_created") or "false"
          pr_metadata = "present" if outputs.get("pr") or outputs.get("prs") else "absent"
          auth_source = "GitHub App token via APP_ID/APP_PRIVATE_KEY"

          lines = [
              "## release-please action outputs",
              "",
              "- Canonical release PR/tag/GitHub Release path: `release-please` from merges to `main`",
              "- Canonical GitHub Release notes owner: `release-please`",
              f"- Auth source: `{auth_source}`",
              f"- Manifest baseline: `{manifest_version}`",
              f"- Candidate version output: `{version}`",
              f"- Tag output: `{tag_name}`",
              f"- PR created in this run: `{prs_created}`",
              f"- Release PR metadata available: `{pr_metadata}`",
              f"- Tag/release created in this run: `{releases_created}`",
              "",
              "<details>",
              "<summary>Raw release-please outputs</summary>",
              "",
              "```json",
              json.dumps(outputs, indent=2, sort_keys=True),
              "```",
              "</details>",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

  publish-release:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.release-please.outputs.tag_name != '' &&
      needs.release-please.outputs.release_id != ''
    uses: ./.github/workflows/_publish.yml
    permissions:
      contents: write
      packages: write
    with:
      release: true
      prerelease: false
      release_tag: ${{ needs.release-please.outputs.tag_name }}
      release_id: ${{ needs.release-please.outputs.release_id }}
    secrets:
      SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
