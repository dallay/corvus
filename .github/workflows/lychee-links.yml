# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Link Checker

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links with lychee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: ✈ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🔗 Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: 🔗 Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config ./lychee.toml --no-progress .
          output: ./lychee/out.md
          fail: false

      - name: 📝 Prepare issue body
        if: steps.lychee.outputs.exit_code != 0
        run: |
          mkdir -p ./lychee
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf "## Summary\n\n"
            printf "Lychee detected broken links on the default branch.\n\n"
            printf -- "- Workflow: \`%s\`\n" "$GITHUB_WORKFLOW"
            printf -- "- Run: %s\n" "$run_url"
            printf -- "- Commit: \`%s\`\n\n" "$GITHUB_SHA"
            printf "## Failures\n\n"
            printf "<details>\n"
            printf "<summary>Expand broken link report</summary>\n\n"
            cat ./lychee/out.md
            printf "\n</details>\n"
          } > ./lychee/issue-body.md

      - name: 🐞 Create or update broken links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_TITLE: "docs: broken links report"
        run: |
          issue_number="$(gh issue list \
            --state open \
            --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title \
            --jq '.[] | select(.title == "docs: broken links report") | .number' | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --title "$ISSUE_TITLE" \
              --body-file ./lychee/issue-body.md \
              --add-label "type|docs" \
              --add-label "module|broken-links" \
              --add-label "status|waiting-for-triage"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file ./lychee/issue-body.md \
              --label "type|docs" \
              --label "module|broken-links" \
              --label "status|waiting-for-triage"
          fi

      - name: ✅ Close broken links issue when report is clean
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_TITLE: "docs: broken links report"
        run: |
          issue_number="$(gh issue list \
            --state open \
            --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title \
            --jq '.[] | select(.title == "docs: broken links report") | .number' | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "Lychee no longer reports broken links in the latest run, so this issue is being closed automatically."
            gh issue close "$issue_number"
          fi

      - name: 💾 Save lychee cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
