# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Dashboard Accessibility

on:
  pull_request:
    branches:
      - main
      - minor
    paths:
      - ".github/workflows/dashboard-accessibility.yml"
      - "clients/web/pnpm-lock.yaml"
      - "clients/web/pnpm-workspace.yaml"
      - "clients/web/apps/dashboard/**"
      - "clients/web/packages/**"
  push:
    branches:
      - main
      - minor
    paths:
      - ".github/workflows/dashboard-accessibility.yml"
      - "clients/web/pnpm-lock.yaml"
      - "clients/web/pnpm-workspace.yaml"
      - "clients/web/apps/dashboard/**"
      - "clients/web/packages/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 10

      - name: 📦 Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: 📥 Install web workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: clients/web

      - name: 🎭 Install Playwright Chromium
        run: pnpm --filter @corvus/dashboard run test:e2e:install
        working-directory: clients/web

      - name: ♿ Run dashboard axe unit smoke tests
        run: pnpm --filter @corvus/dashboard run test:a11y
        working-directory: clients/web

      - name: ♿ Run dashboard accessibility smoke e2e
        run: pnpm --filter @corvus/dashboard run test:e2e:a11y
        working-directory: clients/web
