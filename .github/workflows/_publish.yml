# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "_publish"

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: true
      changelog:
        type: boolean
        default: false
    secrets:
      SIGNING_IN_MEMORY_KEY:
        required: false
      SIGNING_IN_MEMORY_KEY_PASSWORD:
        required: false
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  publish:
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: 📦 Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"

      - name: 🦀 Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: 🦀 Install cross-compilation tools
        if: ${{ inputs.release }}
        run: |
          # Install cross for easy cross-compilation
          cargo install cross --locked

          # Add required targets
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: ☕ Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: wrapper

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🌿 Build Changelog
        if: ${{ inputs.changelog }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@439f79b5b5428107c7688c1d2b0e8bacc9b8792c # v6.0.1
        with:
          configuration: ".github/config/changelog.json"
          commitMode: true
          ignorePreReleases: ${{ !contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Summary Changelog
        if: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            echo "<details>"
            echo "<summary>📜 Release Changelog</summary>"
            echo
            printf "%s\n" "${{ steps.changelog.outputs.changelog }}"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔎 Validate release version consistency
        if: ${{ inputs.release }}
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_VERSION"
            exit 1
          fi

          expected_version="${TAG_VERSION#v}"
          gradle_version="$(awk -F= '/^VERSION=/{print $2}' gradle.properties)"
          cargo_version="$(awk -F' = ' '/^version = /{gsub(/\"/, "", $2); print $2; exit}' clients/agent-runtime/Cargo.toml)"
          npm_version="$(awk -F'"' '/"version"/{print $4; exit}' clients/agent-runtime/npm/corvus-cli/package.json)"

          for item in \
            "gradle.properties:$gradle_version" \
            "clients/agent-runtime/Cargo.toml:$cargo_version" \
            "clients/agent-runtime/npm/corvus-cli/package.json:$npm_version"; do
            file="${item%%:*}"
            actual="${item#*:}"
            if [[ "$actual" != "$expected_version" ]]; then
              echo "Version mismatch in ${file}: expected ${expected_version}, got ${actual}"
              exit 1
            fi
          done

          shopt -s nullglob
          web_version_files=(
            clients/web/package.json
            clients/web/apps/*/package.json
            clients/web/packages/*/package.json
          )

          for file in "${web_version_files[@]}"; do
            [[ -f "$file" ]] || continue
            web_version="$(awk -F'"' '/^[[:space:]]*"version"[[:space:]]*:/{print $4; exit}' "$file")"
            [[ -z "$web_version" ]] && continue
            if [[ "$web_version" != "$expected_version" ]]; then
              echo "Version mismatch in ${file}: expected ${expected_version}, got ${web_version}"
              exit 1
            fi
          done
          shopt -u nullglob

      - name: 🔐 Check optional release credentials
        if: ${{ inputs.release }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          MAVEN_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          set -euo pipefail
          echo "Checking optional release credentials..."
          [[ -n "$SIGNING_KEY" ]] && echo "✅ Maven signing key configured" || echo "⚠️ Maven signing key not configured"
          [[ -n "$MAVEN_USER" ]] && echo "✅ Maven Central credentials configured" || echo "⚠️ Maven Central credentials not configured"
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] && echo "✅ Cargo registry token configured" || echo "⚠️ Cargo registry token not configured"
          [[ -n "$NPM_TOKEN" ]] && echo "✅ NPM token configured" || echo "⚠️ NPM token not configured"
          [[ -n "$DOCKERHUB_USERNAME" ]] && echo "✅ DockerHub credentials configured" || echo "⚠️ DockerHub credentials not configured"

      - name: 👻 Publish to Maven Central
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "${{ secrets.SIGNING_IN_MEMORY_KEY }}" ] || [ -z "${{ secrets.MAVEN_CENTRAL_USERNAME }}" ]; then
            echo "⚠️ Skipping Maven Central publish - required secrets not configured"
            exit 0
          fi
          if [ "${GITHUB_REPOSITORY}" = "dallay/corvus" ]; then
            if [ "${{ inputs.release }}" = "true" ]; then
              ./gradlew :build-logic:publishPluginMavenPublicationToMavenCentralRepository publishToMavenCentral
            else
              ./gradlew publishToMavenCentral
            fi
          else
            ./gradlew publishToMavenCentral
          fi

      - name: 📦 Publish Rust crate to crates.io
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "⚠️ Skipping crates.io publish - CARGO_REGISTRY_TOKEN not configured"
            exit 0
          fi
          cd clients/agent-runtime
          cargo publish --locked

      - name: 📦 Publish npm package
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "⚠️ Skipping npm publish - NPM_TOKEN not configured"
            exit 0
          fi
          cat <<EOF > "$HOME/.npmrc"
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
          cd clients/agent-runtime/npm/corvus-cli
          npm publish --access public

      - name: 🐳 Set up QEMU
        if: ${{ inputs.release }}
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        if: ${{ inputs.release }}
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        if: ${{ inputs.release }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔐 Login to GitHub Container Registry
        if: ${{ inputs.release }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Docker tags and labels
        if: ${{ inputs.release }}
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/corvus
            ghcr.io/${{ github.repository_owner }}/corvus
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: 🐳 Build and push Docker image
        if: ${{ inputs.release }}
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: clients/agent-runtime/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  build-native-binaries:
    if: ${{ inputs.release }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: corvus-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: corvus-linux-arm64
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: corvus-darwin-x64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: corvus-darwin-arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: corvus-windows-x64
            archive_ext: zip

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: 🦀 Resolve Rust channel
        id: rust-channel
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = /{print $2; exit}' clients/agent-runtime/rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "Failed to resolve Rust channel from clients/agent-runtime/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: 🦀 Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --locked

      - name: 🔨 Build binary (Linux native GNU)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cd clients/agent-runtime
          cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: 🔨 Build binary (Linux cross)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          cd clients/agent-runtime
          cross build --release --target ${{ matrix.target }}

      - name: 🔨 Build binary (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          cd clients/agent-runtime
          cargo build --release --locked --target ${{ matrix.target }}

      - name: 📦 Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd clients/agent-runtime
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/corvus" "dist/${{ matrix.artifact_name }}"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"

      - name: 📦 Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force -Path clients/agent-runtime/dist | Out-Null
          Copy-Item "clients/agent-runtime/target/${{ matrix.target }}/release/corvus.exe" "clients/agent-runtime/dist/${{ matrix.artifact_name }}.exe"
          Compress-Archive -Path "clients/agent-runtime/dist/${{ matrix.artifact_name }}.exe" -DestinationPath "clients/agent-runtime/dist/${{ matrix.artifact_name }}.zip" -Force

      - name: ⬆ Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: clients/agent-runtime/dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release-assets:
    if: ${{ inputs.release }}
    needs: [publish, build-native-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇ Download all release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: clients/agent-runtime/dist
          merge-multiple: true

      - name: 📋 Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd clients/agent-runtime/dist
          for archive in *.tar.gz *.zip; do
            [[ -f "$archive" ]] || continue
            sha256sum "$archive" > "$archive.sha256"
          done
          ls -la

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          body: ${{ needs.publish.outputs.changelog }}
          generate_release_notes: true
          files: |
            clients/agent-runtime/dist/corvus-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
