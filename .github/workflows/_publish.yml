# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "_publish"

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: true
      prerelease:
        type: boolean
        required: false
      release_tag:
        type: string
        required: false
      release_id:
        type: string
        required: false
      affected_components:
        type: string
        required: false
    secrets:
      SIGNING_IN_MEMORY_KEY:
        required: false
      SIGNING_IN_MEMORY_KEY_PASSWORD:
        required: false
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  publish:
    outputs:
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      release_version: ${{ steps.release-context.outputs.release_version }}
      release_id: ${{ steps.release-context.outputs.release_id }}
      release_channel: ${{ steps.release-context.outputs.release_channel }}
      release_major_minor: ${{ steps.release-context.outputs.release_major_minor }}
      release_major: ${{ steps.release-context.outputs.release_major }}
      npm_dist_tag: ${{ steps.release-context.outputs.npm_dist_tag }}
      has_corvus_runtime: ${{ steps.component-flags.outputs.has_corvus_runtime }}
      has_rook: ${{ steps.component-flags.outputs.has_rook }}
      has_cerebro: ${{ steps.component-flags.outputs.has_cerebro }}
      has_gradle_kmp: ${{ steps.component-flags.outputs.has_gradle_kmp }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🧭 Resolve component flags
        id: component-flags
        shell: python
        env:
          AFFECTED_COMPONENTS: ${{ inputs.affected_components || '[]' }}
          VALIDATION_OUTPUT: ${{ runner.temp }}/affected-components.json
        run: |
          import json
          import os
          import pathlib
          import subprocess

          validation_output = pathlib.Path(os.environ["VALIDATION_OUTPUT"])
          with validation_output.open("w", encoding="utf-8") as handle:
              subprocess.run(
                  ["node", "scripts/validate-affected-components.mjs"],
                  check=True,
                  text=True,
                  stdout=handle,
                  env=os.environ.copy(),
              )

          payload = json.loads(validation_output.read_text(encoding="utf-8"))
          flags = {
              "has_corvus_runtime": payload["has_corvus_runtime"],
              "has_rook": payload["has_rook"],
              "has_cerebro": payload["has_cerebro"],
              "has_gradle_kmp": payload["has_gradle_kmp"],
          }

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in flags.items():
                  output.write(f"{key}={'true' if value else 'false'}\n")

          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### Resolved affected components\n\n")
              summary.write(f"- Raw payload: `{payload['raw_payload']}`\n")
              summary.write(f"- Resolved affected components: `{', '.join(payload['affected_components'])}`\n")

      - name: 🔎 Validate component flag outputs
        shell: python
        env:
          COMPONENT_FLAG_OUTPUTS: |
            has_corvus_runtime=${{ steps.component-flags.outputs.has_corvus_runtime }}
            has_rook=${{ steps.component-flags.outputs.has_rook }}
            has_cerebro=${{ steps.component-flags.outputs.has_cerebro }}
            has_gradle_kmp=${{ steps.component-flags.outputs.has_gradle_kmp }}
        run: |
          import os

          raw_outputs = os.environ["COMPONENT_FLAG_OUTPUTS"].splitlines()
          for raw_output in raw_outputs:
              key, separator, value = raw_output.partition("=")
              if not separator:
                  raise SystemExit(f"Invalid component flag output entry: {raw_output!r}")
              if value not in {"true", "false"}:
                  raise SystemExit(
                      f"Invalid component flag output {key}: expected 'true' or 'false', got {value!r}",
                  )

      - name: 🦀 Resolve Rust channel
        if: ${{ inputs.release }}
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust
        if: ${{ inputs.release }}
        run: |
          rustup toolchain install "${{ steps.rust-channel.outputs.channel }}" --profile minimal
          rustup default "${{ steps.rust-channel.outputs.channel }}"
          cargo --version

      - name: ☕ Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🧭 Resolve release context
        if: ${{ inputs.release }}
        id: release-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          PRERELEASE: ${{ inputs.prerelease }}
          AFFECTED_COMPONENTS: ${{ inputs.affected_components || '[]' }}
          RELEASE_CONTEXT_OUTPUT: ${{ runner.temp }}/release-context.json
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TAG" || -z "$RELEASE_ID" ]]; then
            echo "Release publishes require release_tag and release_id inputs"
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          release_tag_from_api="$(RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os
          print(json.loads(os.environ["RELEASE_JSON"]).get("tag_name", ""))
          PY
          )"
          release_draft_from_api="$(RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os
          print("true" if json.loads(os.environ["RELEASE_JSON"]).get("draft") else "false")
          PY
          )"
          release_prerelease_from_api="$(RELEASE_JSON="$release_json" python3 - <<'PY'
          import json
          import os
          print("true" if json.loads(os.environ["RELEASE_JSON"]).get("prerelease") else "false")
          PY
          )"

          if [[ "$release_tag_from_api" != "$RELEASE_TAG" ]]; then
            echo "Release id ${RELEASE_ID} points to ${release_tag_from_api} instead of ${RELEASE_TAG}"
            exit 1
          fi
          if [[ "$release_draft_from_api" == "true" ]]; then
            echo "Release publish does not accept draft releases"
            exit 1
          fi
          if [[ "$release_prerelease_from_api" != "$PRERELEASE" ]]; then
            echo "Release prerelease state ${release_prerelease_from_api} does not match expected ${PRERELEASE}"
            exit 1
          fi

          node scripts/resolve-release-context.mjs > "$RELEASE_CONTEXT_OUTPUT"

          python3 <<'PY'
          import json
          import os
          import pathlib

          payload = json.loads(pathlib.Path(os.environ["RELEASE_CONTEXT_OUTPUT"]).read_text(encoding="utf-8"))
          output_keys = [
              "release_tag",
              "release_version",
              "release_id",
              "release_channel",
              "release_major_minor",
              "release_major",
              "npm_dist_tag",
          ]

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key in output_keys:
                  output.write(f"{key}={payload[key]}\n")

          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### Release context\n\n")
              summary.write(f"- Component: `{payload['release_component']}`\n")
              summary.write(f"- Version: `{payload['release_version']}`\n")
              summary.write(f"- Channel: `{payload['release_channel']}`\n")
              summary.write(f"- npm dist-tag: `{payload['npm_dist_tag']}`\n")
              summary.write(f"- Affected components: `{', '.join(payload['affected_components'])}`\n")
          PY

      - name: 🔎 Validate release version consistency
        if: ${{ inputs.release }}
        id: release-version-check
        env:
          EXPECTED_VERSION: ${{ steps.release-context.outputs.release_version }}
          RELEASE_CHANNEL: ${{ steps.release-context.outputs.release_channel }}
          AFFECTED_COMPONENTS: ${{ inputs.affected_components || '[]' }}
        run: |

          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["EXPECTED_VERSION"]
          channel = os.environ["RELEASE_CHANNEL"].title()
          affected_components_raw = os.environ.get("AFFECTED_COMPONENTS", '[]')
          try:
              affected_components = set(json.loads(affected_components_raw))
          except json.JSONDecodeError as exc:
              raise RuntimeError(f"Invalid AFFECTED_COMPONENTS payload: {affected_components_raw}") from exc

          def read_properties(path: str, key: str) -> str:
              for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  if line.startswith(f"{key}="):
                      return line.split("=", 1)[1].strip()
              raise RuntimeError(f"Missing {key} in {path}")

          def read_toml_version(path: str) -> str:
              data = tomllib.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              return data["package"]["version"]

          def read_json_version(path: str) -> str:
              return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))["version"]

          checks = []
          if "gradle-kmp" in affected_components:
              checks.extend([
                  ("gradle.properties", read_properties("gradle.properties", "VERSION")),
                  (
                      "gradle/build-logic/gradle.properties",
                      read_properties("gradle/build-logic/gradle.properties", "VERSION"),
                  ),
              ])

          if "corvus-runtime" in affected_components:
              checks.extend([
                  ("clients/agent-runtime/Cargo.toml", read_toml_version("clients/agent-runtime/Cargo.toml")),
                  (
                      "clients/agent-runtime/npm/corvus/package.json",
                      read_json_version("clients/agent-runtime/npm/corvus/package.json"),
                  ),
                  (
                      "clients/agent-runtime/npm/corvus-darwin-x64/package.json",
                      read_json_version("clients/agent-runtime/npm/corvus-darwin-x64/package.json"),
                  ),
                  (
                      "clients/agent-runtime/npm/corvus-darwin-arm64/package.json",
                      read_json_version("clients/agent-runtime/npm/corvus-darwin-arm64/package.json"),
                  ),
                  (
                      "clients/agent-runtime/npm/corvus-linux-x64/package.json",
                      read_json_version("clients/agent-runtime/npm/corvus-linux-x64/package.json"),
                  ),
                  (
                      "clients/agent-runtime/npm/corvus-linux-arm64/package.json",
                      read_json_version("clients/agent-runtime/npm/corvus-linux-arm64/package.json"),
                  ),
                  (
                      "clients/agent-runtime/npm/corvus-windows-x64/package.json",
                      read_json_version("clients/agent-runtime/npm/corvus-windows-x64/package.json"),
                  ),
              ])

          if "cerebro" in affected_components:
              checks.extend([
                  ("clients/cerebro/Cargo.toml", read_toml_version("clients/cerebro/Cargo.toml")),
              ])

          if "rook" in affected_components:
              checks.extend([
                  ("clients/rook/Cargo.toml", read_toml_version("clients/rook/Cargo.toml")),
                  (
                      "clients/rook/npm/rook/package.json",
                      read_json_version("clients/rook/npm/rook/package.json"),
                  ),
                  (
                      "clients/rook/npm/rook-darwin-x64/package.json",
                      read_json_version("clients/rook/npm/rook-darwin-x64/package.json"),
                  ),
                  (
                      "clients/rook/npm/rook-darwin-arm64/package.json",
                      read_json_version("clients/rook/npm/rook-darwin-arm64/package.json"),
                  ),
                  (
                      "clients/rook/npm/rook-linux-x64/package.json",
                      read_json_version("clients/rook/npm/rook-linux-x64/package.json"),
                  ),
                  (
                      "clients/rook/npm/rook-linux-arm64/package.json",
                      read_json_version("clients/rook/npm/rook-linux-arm64/package.json"),
                  ),
                  (
                      "clients/rook/npm/rook-windows-x64/package.json",
                      read_json_version("clients/rook/npm/rook-windows-x64/package.json"),
                  ),
              ])

          if not checks:
              raise RuntimeError(f"No version checks configured for affected components: {sorted(affected_components)}")

          failures = [(surface, actual) for surface, actual in checks if actual != expected]

          lines = [
              f"### {channel} version checks",
              "",
              f"Expected version: `{expected}`",
              "",
              "| Surface | Actual | Status |",
              "| --- | --- | --- |",
          ]
          for surface, actual in checks:
              status = "✅ pass" if actual == expected else "❌ fail"
              lines.append(f"| `{surface}` | `{actual}` | {status} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          if failures:
              for surface, actual in failures:
                  print(f"Version mismatch in {surface}: expected {expected}, got {actual}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: 🔐 Check optional release credentials
        if: ${{ inputs.release }}
        id: optional-release-credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          MAVEN_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          set -euo pipefail
          echo "Checking optional release credentials..."
          [[ -n "$SIGNING_KEY" ]] && echo "✅ Maven signing key configured" || echo "⚠️ Maven signing key not configured"
          [[ -n "$MAVEN_USER" ]] && echo "✅ Maven Central credentials configured" || echo "⚠️ Maven Central credentials not configured"
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] && echo "✅ Cargo registry token configured" || echo "⚠️ Cargo registry token not configured"
          [[ -n "$NPM_TOKEN" ]] && echo "✅ NPM token configured" || echo "⚠️ NPM token not configured"
          [[ -n "$DOCKERHUB_USERNAME" ]] && echo "✅ DockerHub credentials configured" || echo "⚠️ DockerHub credentials not configured"
          {
            echo "### Optional credential status"
            echo
            echo "- Maven signing key: $([[ -n \"$SIGNING_KEY\" ]] && echo 'configured' || echo 'missing')"
            echo "- Maven Central credentials: $([[ -n \"$MAVEN_USER\" ]] && echo 'configured' || echo 'missing')"
            echo "- Cargo registry token: $([[ -n \"$CARGO_REGISTRY_TOKEN\" ]] && echo 'configured' || echo 'missing')"
            echo "- npm token: $([[ -n \"$NPM_TOKEN\" ]] && echo 'configured' || echo 'missing')"
            echo "- DockerHub credentials: $([[ -n \"$DOCKERHUB_USERNAME\" ]] && echo 'configured' || echo 'missing')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 👻 Publish Gradle/Maven artifacts
        if: ${{ steps.component-flags.outputs.has_gradle_kmp == 'true' }}
        id: publish-maven
        continue-on-error: true
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          MAVEN_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$MAVEN_USER" ]; then
            echo "⚠️ Skipping Maven Central publish - required secrets not configured"
            exit 0
          fi
          # This repository has no root build.gradle.kts. The Maven Central tasks live in the
          # included build at gradle/build-logic, where the Vanniktech plugin creates
          # publishAllPublicationsToMavenCentralRepository/publishToMavenCentral.
          ./gradlew -p gradle/build-logic publishToMavenCentral

      - name: 📦 Publish corvus-traits crate to crates.io
        if: ${{ inputs.release && steps.component-flags.outputs.has_corvus_runtime == 'true' }}
        id: publish-cargo-corvus-traits
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "⚠️ Skipping crates.io publish - CARGO_REGISTRY_TOKEN not configured"
            exit 0
          fi
          cd clients/agent-runtime/crates/corvus-traits
          cargo publish --locked

      - name: 📦 Publish Rust crate to crates.io
        if: ${{ inputs.release && steps.component-flags.outputs.has_corvus_runtime == 'true' }}
        id: publish-cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "⚠️ Skipping crates.io publish - CARGO_REGISTRY_TOKEN not configured"
            exit 0
          fi
          cd clients/agent-runtime
          cargo publish --locked

      - name: 📦 Publish Rook crate to crates.io
        if: ${{ inputs.release && steps.component-flags.outputs.has_rook == 'true' }}
        id: publish-cargo-rook
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "⚠️ Skipping crates.io publish - CARGO_REGISTRY_TOKEN not configured"
            exit 0
          fi
          echo "Assumes corvus-traits has already been published for this release line."
          cd clients/rook
          cargo publish --locked

      - name: 📄 Release publish summary
        if: ${{ always() && inputs.release }}
        env:
          RELEASE_CHANNEL: ${{ steps.release-context.outputs.release_channel }}
          NPM_DIST_TAG: ${{ steps.release-context.outputs.npm_dist_tag }}
          VERSION_CHECK_OUTCOME: ${{ steps.release-version-check.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.optional-release-credentials.outcome }}
          MAVEN_OUTCOME: ${{ steps.publish-maven.outcome }}
          CARGO_OUTCOME: ${{ steps.publish-cargo.outcome }}
          CARGO_TRAITS_OUTCOME: ${{ steps.publish-cargo-corvus-traits.outcome }}
          CARGO_ROOK_OUTCOME: ${{ steps.publish-cargo-rook.outcome }}
          HAS_CORVUS_RUNTIME: ${{ steps.component-flags.outputs.has_corvus_runtime }}
          HAS_ROOK: ${{ steps.component-flags.outputs.has_rook }}
          HAS_CEREBRO: ${{ steps.component-flags.outputs.has_cerebro }}
          HAS_GRADLE_KMP: ${{ steps.component-flags.outputs.has_gradle_kmp }}
        run: |
          {
             echo "## ${RELEASE_CHANNEL^} release publish summary"
             echo
             echo "- Channel: ${RELEASE_CHANNEL}"
             echo "- Incoming tag: ${{ steps.release-context.outputs.release_tag }}"
             echo "- Existing GitHub Release asset upload target: ${{ steps.release-context.outputs.release_id }}"
             echo "- ${RELEASE_CHANNEL^} version checks: ${VERSION_CHECK_OUTCOME}"
             echo "- Optional credential check: ${CREDENTIALS_OUTCOME}"
             echo "- Maven/Gradle publish step: ${MAVEN_OUTCOME}"
             echo "- Rust publish step (corvus): ${CARGO_OUTCOME}"
             echo "- Rust publish step (corvus-traits): ${CARGO_TRAITS_OUTCOME}"
             echo "- Rust publish step (rook): ${CARGO_ROOK_OUTCOME}"
             echo "- npm dist-tag: ${NPM_DIST_TAG}"
             echo "- npm stable contract: @dallay/corvus, corvus-darwin-x64, corvus-darwin-arm64, corvus-linux-x64, corvus-linux-arm64, corvus-windows-x64"
             echo "- rook npm stable contract: @dallay/rook, rook-darwin-x64, rook-darwin-arm64, rook-linux-x64, rook-linux-arm64, rook-windows-x64"
             echo "- Excluded by policy: corvus-cli is internal/private; Windows ARM64 is intentionally unsupported for stable npm publication"
             echo "- Stable notes source: release-please owns canonical stable release notes"
             echo "- Beta notes source: release-please owns canonical beta release notes"
             echo "- GitHub Release ownership: release-please owns the canonical GitHub Release and canonical ${RELEASE_CHANNEL} release notes; _publish.yml only publishes artifacts/assets"
             echo
             echo "### Component status"
             echo
             if [ "${HAS_CORVUS_RUNTIME}" = "true" ]; then
               echo "#### corvus-runtime"
               echo "- Policy: publishable"
               echo "- Version validation: ${VERSION_CHECK_OUTCOME}"
               echo "- Cargo publish (corvus): ${CARGO_OUTCOME}"
               echo "- Cargo publish (corvus-traits): ${CARGO_TRAITS_OUTCOME}"
               echo "- npm publication: delegated to component-scoped downstream jobs"
               echo "- Docker publication: delegated to component-scoped downstream jobs"
               echo
             fi
             if [ "${HAS_CEREBRO}" = "true" ]; then
               echo "#### cerebro"
               echo "- Policy: publishable"
               echo "- Version validation: ${VERSION_CHECK_OUTCOME}"
               echo "- Cargo/release asset publication: delegated to component-scoped downstream jobs"
               echo "- Docker publication: delegated to component-scoped downstream jobs"
               echo
             fi
             if [ "${HAS_ROOK}" = "true" ]; then
               echo "#### rook"
               echo "- Policy: publishable"
               echo "- Version validation: ${VERSION_CHECK_OUTCOME}"
               echo "- Cargo publish (rook): ${CARGO_ROOK_OUTCOME}"
               echo "- npm publication: delegated to component-scoped downstream jobs"
               echo "- Docker publication: delegated to component-scoped downstream jobs"
               echo
             fi
             if [ "${HAS_GRADLE_KMP}" = "true" ]; then
               echo "#### gradle-kmp"
               echo "- Policy: validate-only"
               echo "- Version validation: ${VERSION_CHECK_OUTCOME}"
               echo "- Maven/Gradle publication step: ${MAVEN_OUTCOME}"
               echo "- Release state ownership: not yet modeled as its own release-please manifest authority"
               echo
             fi
           } >> "$GITHUB_STEP_SUMMARY"

  build-native-binaries:
    if: ${{ inputs.release && needs.publish.outputs.has_corvus_runtime == 'true' }}
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/_build-native-binaries.yml

  build-cerebro-binaries:
    if: ${{ inputs.release && needs.publish.outputs.has_cerebro == 'true' }}
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/_build-cerebro-binaries.yml

  build-rook-binaries:
    if: ${{ inputs.release && needs.publish.outputs.has_rook == 'true' }}
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/_build-rook-binaries.yml

  docker-image:
    if: ${{ inputs.release && needs.publish.outputs.has_corvus_runtime == 'true' }}
    needs: [publish, build-native-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⬇ Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corvus-linux-*
          path: clients/agent-runtime/dist
          merge-multiple: true
          if-no-files-found: error

      - name: 📦 Extract Linux binaries
