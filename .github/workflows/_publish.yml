# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "_publish"

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: true
      changelog:
        type: boolean
        default: false
    secrets:
      SIGNING_IN_MEMORY_KEY:
        required: false
      SIGNING_IN_MEMORY_KEY_PASSWORD:
        required: false
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  publish:
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 📦 Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: 🦀 Resolve Rust channel
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust
        run: |
          rustup toolchain install "${{ steps.rust-channel.outputs.channel }}" --profile minimal
          rustup default "${{ steps.rust-channel.outputs.channel }}"
          cargo --version

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: wrapper

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🌿 Build Changelog
        if: ${{ inputs.changelog }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@a34a8009a9588bb86b02a873cf592440e96a5da8 # v6.1.1
        with:
          configuration: ".github/config/changelog.json"
          commitMode: true
          ignorePreReleases: ${{ !contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Summary Changelog
        if: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            echo "<details>"
            echo "<summary>📜 Release Changelog</summary>"
            echo
            printf "%s\n" "${{ steps.changelog.outputs.changelog }}"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔎 Validate release version consistency
        if: ${{ inputs.release }}
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_VERSION"
            exit 1
          fi

          expected_version="${TAG_VERSION#v}"
          gradle_version="$(awk -F= '/^VERSION=/{print $2}' gradle.properties)"
          cargo_version="$(awk -F' = ' '/^version = /{gsub(/\"/, "", $2); print $2; exit}' clients/agent-runtime/Cargo.toml)"
          npm_version="$(awk -F'"' '/"version"/{print $4; exit}' clients/agent-runtime/npm/corvus/package.json)"

          for item in \
            "gradle.properties:$gradle_version" \
            "clients/agent-runtime/Cargo.toml:$cargo_version" \
            "clients/agent-runtime/npm/corvus/package.json:$npm_version"; do
            file="${item%%:*}"
            actual="${item#*:}"
            if [[ "$actual" != "$expected_version" ]]; then
              echo "Version mismatch in ${file}: expected ${expected_version}, got ${actual}"
              exit 1
            fi
          done

          shopt -s nullglob
          web_version_files=(
            clients/web/package.json
            clients/web/apps/*/package.json
            clients/web/packages/*/package.json
          )

          for file in "${web_version_files[@]}"; do
            [[ -f "$file" ]] || continue
            web_version="$(awk -F'"' '/^[[:space:]]*"version"[[:space:]]*:/{print $4; exit}' "$file")"
            [[ -z "$web_version" ]] && continue
            if [[ "$web_version" != "$expected_version" ]]; then
              echo "Version mismatch in ${file}: expected ${expected_version}, got ${web_version}"
              exit 1
            fi
          done
          shopt -u nullglob

      - name: 🔐 Check optional release credentials
        if: ${{ inputs.release }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          MAVEN_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          set -euo pipefail
          echo "Checking optional release credentials..."
          [[ -n "$SIGNING_KEY" ]] && echo "✅ Maven signing key configured" || echo "⚠️ Maven signing key not configured"
          [[ -n "$MAVEN_USER" ]] && echo "✅ Maven Central credentials configured" || echo "⚠️ Maven Central credentials not configured"
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] && echo "✅ Cargo registry token configured" || echo "⚠️ Cargo registry token not configured"
          [[ -n "$NPM_TOKEN" ]] && echo "✅ NPM token configured" || echo "⚠️ NPM token not configured"
          [[ -n "$DOCKERHUB_USERNAME" ]] && echo "✅ DockerHub credentials configured" || echo "⚠️ DockerHub credentials not configured"

      - name: 👻 Publish to Maven Central
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "${{ secrets.SIGNING_IN_MEMORY_KEY }}" ] || [ -z "${{ secrets.MAVEN_CENTRAL_USERNAME }}" ]; then
            echo "⚠️ Skipping Maven Central publish - required secrets not configured"
            exit 0
          fi
          if [ "${GITHUB_REPOSITORY}" = "dallay/corvus" ]; then
            if [ "${{ inputs.release }}" = "true" ]; then
              ./gradlew :build-logic:publishPluginMavenPublicationToMavenCentralRepository publishToMavenCentral
            else
              ./gradlew publishToMavenCentral
            fi
          else
            ./gradlew publishToMavenCentral
          fi

      - name: 📦 Publish Rust crate to crates.io
        if: ${{ inputs.release }}
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "⚠️ Skipping crates.io publish - CARGO_REGISTRY_TOKEN not configured"
            exit 0
          fi
          cd clients/agent-runtime
          cargo publish --locked

  build-native-binaries:
    if: ${{ inputs.release }}
    needs: publish
    uses: ./.github/workflows/_build-native-binaries.yml

  docker-image:
    if: ${{ inputs.release }}
    needs: [publish, build-native-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⬇ Download Linux artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: corvus-linux-*
          path: clients/agent-runtime/dist
          merge-multiple: true
          if-no-files-found: error

      - name: 📦 Extract Linux binaries
        working-directory: clients/agent-runtime/dist
        run: |
          set -euo pipefail
          tar -xzf corvus-linux-x64.tar.gz
          tar -xzf corvus-linux-arm64.tar.gz
          chmod +x corvus-linux-x64 corvus-linux-arm64

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: 🔐 Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Docker tags and labels
        id: docker-meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/corvus
            ghcr.io/${{ github.repository_owner }}/corvus
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: 🐳 Build and push Docker image (prebuilt binaries)
        continue-on-error: true
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: clients/agent-runtime/Dockerfile.release-prebuilt
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  publish-npm-platforms:
    if: ${{ inputs.release }}
    needs: build-native-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: corvus-darwin-x64
            artifact: corvus-darwin-x64
            binary: corvus
            source_binary: corvus-darwin-x64
          - pkg: corvus-darwin-arm64
            artifact: corvus-darwin-arm64
            binary: corvus
            source_binary: corvus-darwin-arm64
          - pkg: corvus-linux-x64
            artifact: corvus-linux-x64
            binary: corvus
            source_binary: corvus-linux-x64
          - pkg: corvus-linux-arm64
            artifact: corvus-linux-arm64
            binary: corvus
            source_binary: corvus-linux-arm64
          - pkg: corvus-windows-x64
            artifact: corvus-windows-x64
            binary: corvus.exe
            source_binary: corvus-windows-x64.exe
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: ⬇ Download artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/artifact

      - name: 📦 Extract binary
        run: |
          set -euo pipefail
          cd /tmp/artifact
          # List contents for debugging
          echo "Contents of /tmp/artifact:"
          ls -la
          # Find and extract the archive
          archive=$(find . -name "*.tar.gz" -o -name "*.zip" | head -1)
          if [ -z "$archive" ]; then
            echo "No archive found!"
            exit 1
          fi
          echo "Found archive: $archive"
          if [[ "$archive" == *.tar.gz ]]; then
            tar -xzf "$archive"
          else
            unzip -o "$archive"
          fi
          # Show extracted contents
          echo "After extraction:"
          ls -la
          # Find the packaged binary and make it executable
          find . -name "${{ matrix.source_binary }}" -type f -exec chmod +x {} \; -print

      - name: 🚀 Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ Skipping npm publish - NPM_TOKEN not configured"
            exit 0
          fi

          cd clients/agent-runtime/npm/${{ matrix.pkg }}

          # Find and copy the binary from extracted archive
          binary_path=$(find /tmp/artifact -name "${{ matrix.source_binary }}" -type f | head -1)
          if [ -z "$binary_path" ]; then
            echo "Binary not found!"
            exit 1
          fi
          echo "Copying binary from: $binary_path"
          cp "$binary_path" ./${{ matrix.binary }}

          package_name="@dallay/${{ matrix.pkg }}"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️ ${package_name}@${package_version} is already published, skipping"
            exit 0
          fi

          npm publish --access public

  publish-npm-base:
    if: ${{ inputs.release }}
    needs: publish-npm-platforms
    runs-on: ubuntu-latest
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: 🚀 Publish base package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ Skipping npm publish - NPM_TOKEN not configured"
            exit 0
          fi

          cd clients/agent-runtime/npm/corvus

          package_name="@dallay/corvus"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️ ${package_name}@${package_version} is already published, skipping"
            exit 0
          fi

          npm publish --access public

  release-assets:
    if: ${{ inputs.release }}
    needs: [publish, build-native-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇ Download all release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: corvus-*
          path: clients/agent-runtime/dist
          merge-multiple: true
          if-no-files-found: error

      - name: 📋 Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd clients/agent-runtime/dist
          for archive in *.tar.gz *.zip; do
            [[ -f "$archive" ]] || continue
            sha256sum "$archive" > "$archive.sha256"
          done
          ls -la

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          body: ${{ needs.publish.outputs.changelog }}
          generate_release_notes: true
          files: |
            clients/agent-runtime/dist/corvus-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
