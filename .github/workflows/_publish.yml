    needs: [publish-npm-platforms-rook, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: 🚀 Publish base package
        id: publish-base-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.publish.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ Skipping npm publish - NPM_TOKEN not configured"
            exit 0
          fi

          cd clients/rook/npm/rook

          package_name="@dallay/rook"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️ ${package_name}@${package_version} is already published, skipping"
            exit 0
          fi

          npm_publish_args=(--access public)
          if [ "${NPM_DIST_TAG:-latest}" != "latest" ]; then
            npm_publish_args+=(--tag "$NPM_DIST_TAG")
          fi

          npm publish "${npm_publish_args[@]}"

  release-assets:
    if: ${{ inputs.release }}
    needs:
      [
        publish,
        build-native-binaries,
        build-cerebro-binaries,
        build-rook-binaries,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: ⬇ Download corvus release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corvus-*
          path: dist/corvus
          merge-multiple: true
          if-no-files-found: error

      - name: ⬇ Download cerebro release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cerebro-*
          path: dist/cerebro
          merge-multiple: true
          if-no-files-found: error

      - name: ⬇ Download rook release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rook-*
          path: dist/rook
          merge-multiple: true
          if-no-files-found: error

      - name: 📋 Generate SHA256 checksums
        run: |
          set -euo pipefail
          for dir in dist/corvus dist/cerebro dist/rook; do
            cd "$dir"
            for archive in *.tar.gz *.zip; do
              [[ -f "$archive" ]] || continue
              sha256sum "$archive" > "$archive.sha256"
            done
            ls -la
            cd "$GITHUB_WORKSPACE"
          done

      - name: 🚀 Upload assets to existing GitHub Release
        id: upload-release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
        run: |
          set -euo pipefail
          echo "Uploading assets to existing GitHub Release ${RELEASE_ID} (${RELEASE_TAG})"
          gh release upload "$RELEASE_TAG" dist/corvus/corvus-* dist/cerebro/cerebro-* dist/rook/rook-* --clobber --repo "$GITHUB_REPOSITORY"

      - name: 📄 Summarize GitHub Release publication
        if: ${{ always() }}
        env:
          RELEASE_CHANNEL: ${{ needs.publish.outputs.release_channel }}
          RELEASE_ASSETS_OUTCOME: ${{ steps.upload-release-assets.outcome }}
        run: |
          {
            echo "## GitHub Release publication"
            echo
             echo "- Channel: ${RELEASE_CHANNEL}"
             echo "- Outcome: ${RELEASE_ASSETS_OUTCOME}"
             echo "- Canonical public release record: existing GitHub Release for ${{ needs.publish.outputs.release_tag }}"
             echo "- Existing GitHub Release asset upload: gh release upload --clobber"
             echo "- Notes source: release-please owns canonical ${RELEASE_CHANNEL} release notes; _publish.yml must not replace them"
           } >> "$GITHUB_STEP_SUMMARY"
