# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "_publish"

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: true
      prerelease:
        type: boolean
        required: false
      release_tag:
        type: string
        required: false
      release_id:
        type: string
        required: false
    secrets:
      SIGNING_IN_MEMORY_KEY:
        required: false
      SIGNING_IN_MEMORY_KEY_PASSWORD:
        required: false
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  publish:
    outputs:
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      release_version: ${{ steps.release-context.outputs.release_version }}
      release_id: ${{ steps.release-context.outputs.release_id }}
      release_channel: ${{ steps.release-context.outputs.release_channel }}
      release_major_minor: ${{ steps.release-context.outputs.release_major_minor }}
      release_major: ${{ steps.release-context.outputs.release_major }}
      npm_dist_tag: ${{ steps.release-context.outputs.npm_dist_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write

    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 🦀 Resolve Rust channel
        if: ${{ inputs.release }}
        id: rust-channel
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          toolchain_file = pathlib.Path("clients/agent-runtime/rust-toolchain.toml")
          data = tomllib.loads(toolchain_file.read_text(encoding="utf-8"))
          channel = data.get("toolchain", {}).get("channel")

          if not channel:
              raise SystemExit(
                  "Failed to resolve [toolchain].channel from "
                  "clients/agent-runtime/rust-toolchain.toml",
              )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"channel={channel}\n")

      - name: 🦀 Setup Rust
        if: ${{ inputs.release }}
        run: |
          rustup toolchain install "${{ steps.rust-channel.outputs.channel }}" --profile minimal
          rustup default "${{ steps.rust-channel.outputs.channel }}"
          cargo --version

      - name: ☕ Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: wrapper

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: 🔧 Show Gradle version
        run: ./gradlew --version

      - name: 🧭 Resolve release context
        if: ${{ inputs.release }}
        id: release-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TAG" || -z "$RELEASE_ID" ]]; then
            echo "Release publishes require release_tag and release_id inputs"
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          RELEASE_JSON="$release_json" RELEASE_TAG="$RELEASE_TAG" PRERELEASE="$PRERELEASE" python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          release = json.loads(os.environ["RELEASE_JSON"])
          expected_tag = os.environ["RELEASE_TAG"]
          is_prerelease = os.environ["PRERELEASE"].lower() == "true"
          channel = "beta" if is_prerelease else "stable"
          tag_pattern = r"^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$" if is_prerelease else r"^v[0-9]+\.[0-9]+\.[0-9]+$"

          if not re.match(tag_pattern, expected_tag):
              print(f"Invalid {channel} release tag: {expected_tag}", file=sys.stderr)
              raise SystemExit(1)

          if release.get("tag_name") != expected_tag:
              print(
                  f"Release id {release.get('id')} points to {release.get('tag_name')} instead of {expected_tag}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          if release.get("draft"):
              print(f"{channel.title()} publish does not accept draft releases", file=sys.stderr)
              raise SystemExit(1)
          if bool(release.get("prerelease")) != is_prerelease:
              expected_state = "a prerelease" if is_prerelease else "a stable release"
              print(f"{channel.title()} publish requires {expected_state}", file=sys.stderr)
              raise SystemExit(1)

          version = expected_tag.removeprefix("v")
          base_version = version.split("-", 1)[0]
          major, minor, _patch = base_version.split(".")
          npm_dist_tag = "beta" if is_prerelease else "latest"

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"release_tag={expected_tag}\n")
              handle.write(f"release_version={version}\n")
              handle.write(f"release_id={release['id']}\n")
              handle.write(f"release_channel={channel}\n")
              handle.write(f"release_major_minor={major}.{minor}\n")
              handle.write(f"release_major={major}\n")
              handle.write(f"npm_dist_tag={npm_dist_tag}\n")
          PY

      - name: 🔎 Validate release version consistency
        if: ${{ inputs.release }}
        id: release-version-check
        env:
          EXPECTED_VERSION: ${{ steps.release-context.outputs.release_version }}
          RELEASE_CHANNEL: ${{ steps.release-context.outputs.release_channel }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          expected = os.environ["EXPECTED_VERSION"]
          channel = os.environ["RELEASE_CHANNEL"].title()

          def read_properties(path: str, key: str) -> str:
              for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  if line.startswith(f"{key}="):
                      return line.split("=", 1)[1].strip()
              raise RuntimeError(f"Missing {key} in {path}")

          def read_toml_version(path: str) -> str:
              data = tomllib.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              return data["package"]["version"]

          def read_json_version(path: str) -> str:
              return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))["version"]

          checks = [
              ("version.txt", pathlib.Path("version.txt").read_text(encoding="utf-8").strip()),
              ("gradle.properties", read_properties("gradle.properties", "VERSION")),
              (
                  "gradle/build-logic/gradle.properties",
                  read_properties("gradle/build-logic/gradle.properties", "VERSION"),
              ),
              ("clients/agent-runtime/Cargo.toml", read_toml_version("clients/agent-runtime/Cargo.toml")),
              ("modules/cerebro/Cargo.toml", read_toml_version("modules/cerebro/Cargo.toml")),
              (
                  "clients/agent-runtime/npm/corvus/package.json",
                  read_json_version("clients/agent-runtime/npm/corvus/package.json"),
              ),
              (
                  "clients/agent-runtime/npm/corvus-darwin-x64/package.json",
                  read_json_version("clients/agent-runtime/npm/corvus-darwin-x64/package.json"),
              ),
              (
                  "clients/agent-runtime/npm/corvus-darwin-arm64/package.json",
                  read_json_version("clients/agent-runtime/npm/corvus-darwin-arm64/package.json"),
              ),
              (
                  "clients/agent-runtime/npm/corvus-linux-x64/package.json",
                  read_json_version("clients/agent-runtime/npm/corvus-linux-x64/package.json"),
              ),
              (
                  "clients/agent-runtime/npm/corvus-linux-arm64/package.json",
                  read_json_version("clients/agent-runtime/npm/corvus-linux-arm64/package.json"),
              ),
              (
                  "clients/agent-runtime/npm/corvus-windows-x64/package.json",
                  read_json_version("clients/agent-runtime/npm/corvus-windows-x64/package.json"),
              ),
          ]

          failures = [(surface, actual) for surface, actual in checks if actual != expected]

          lines = [
              f"### {channel} version checks",
              "",
              f"Expected version: `{expected}`",
              "",
              "| Surface | Actual | Status |",
              "| --- | --- | --- |",
          ]
          for surface, actual in checks:
              status = "✅ pass" if actual == expected else "❌ fail"
              lines.append(f"| `{surface}` | `{actual}` | {status} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          if failures:
              for surface, actual in failures:
                  print(f"Version mismatch in {surface}: expected {expected}, got {actual}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: 🔐 Check optional release credentials
        if: ${{ inputs.release }}
        id: optional-release-credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          MAVEN_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          set -euo pipefail
          echo "Checking optional release credentials..."
          [[ -n "$SIGNING_KEY" ]] && echo "✅ Maven signing key configured" || echo "⚠️ Maven signing key not configured"
          [[ -n "$MAVEN_USER" ]] && echo "✅ Maven Central credentials configured" || echo "⚠️ Maven Central credentials not configured"
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] && echo "✅ Cargo registry token configured" || echo "⚠️ Cargo registry token not configured"
          [[ -n "$NPM_TOKEN" ]] && echo "✅ NPM token configured" || echo "⚠️ NPM token not configured"
          [[ -n "$DOCKERHUB_USERNAME" ]] && echo "✅ DockerHub credentials configured" || echo "⚠️ DockerHub credentials not configured"
          {
            echo "### Optional credential status"
            echo
            echo "- Maven signing key: $([[ -n \"$SIGNING_KEY\" ]] && echo 'configured' || echo 'missing')"
            echo "- Maven Central credentials: $([[ -n \"$MAVEN_USER\" ]] && echo 'configured' || echo 'missing')"
            echo "- Cargo registry token: $([[ -n \"$CARGO_REGISTRY_TOKEN\" ]] && echo 'configured' || echo 'missing')"
            echo "- npm token: $([[ -n \"$NPM_TOKEN\" ]] && echo 'configured' || echo 'missing')"
            echo "- DockerHub credentials: $([[ -n \"$DOCKERHUB_USERNAME\" ]] && echo 'configured' || echo 'missing')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 👻 Publish Gradle/Maven artifacts
        id: publish-maven
        continue-on-error: true
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          MAVEN_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$MAVEN_USER" ]; then
            echo "⚠️ Skipping Maven Central publish - required secrets not configured"
            exit 0
          fi
          # This repository has no root build.gradle.kts. The Maven Central tasks live in the
          # included build at gradle/build-logic, where the Vanniktech plugin creates
          # publishAllPublicationsToMavenCentralRepository/publishToMavenCentral.
          ./gradlew -p gradle/build-logic publishToMavenCentral

      - name: 📦 Publish Rust crate to crates.io
        if: ${{ inputs.release }}
        id: publish-cargo
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "⚠️ Skipping crates.io publish - CARGO_REGISTRY_TOKEN not configured"
            exit 0
          fi
          cd clients/agent-runtime
          cargo publish --locked

      - name: 📄 Release publish summary
        if: ${{ always() && inputs.release }}
        env:
          RELEASE_CHANNEL: ${{ steps.release-context.outputs.release_channel }}
          NPM_DIST_TAG: ${{ steps.release-context.outputs.npm_dist_tag }}
          VERSION_CHECK_OUTCOME: ${{ steps.release-version-check.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.optional-release-credentials.outcome }}
          MAVEN_OUTCOME: ${{ steps.publish-maven.outcome }}
          CARGO_OUTCOME: ${{ steps.publish-cargo.outcome }}
        run: |
          {
             echo "## ${RELEASE_CHANNEL^} release publish summary"
             echo
             echo "- Channel: ${RELEASE_CHANNEL}"
             echo "- Incoming tag: ${{ steps.release-context.outputs.release_tag }}"
             echo "- Existing GitHub Release asset upload target: ${{ steps.release-context.outputs.release_id }}"
             echo "- ${RELEASE_CHANNEL^} version checks: ${VERSION_CHECK_OUTCOME}"
             echo "- Optional credential check: ${CREDENTIALS_OUTCOME}"
             echo "- Maven/Gradle publish step: ${MAVEN_OUTCOME}"
             echo "- Rust publish step: ${CARGO_OUTCOME}"
             echo "- npm dist-tag: ${NPM_DIST_TAG}"
             echo "- npm stable contract: @dallay/corvus, corvus-darwin-x64, corvus-darwin-arm64, corvus-linux-x64, corvus-linux-arm64, corvus-windows-x64"
             echo "- Excluded by policy: corvus-cli is internal/private; Windows ARM64 is intentionally unsupported for stable npm publication"
             echo "- Stable notes source: release-please owns canonical stable release notes"
             echo "- Beta notes source: release-please owns canonical beta release notes"
             echo "- GitHub Release ownership: release-please owns the canonical GitHub Release and canonical ${RELEASE_CHANNEL} release notes; _publish.yml only publishes artifacts/assets"
           } >> "$GITHUB_STEP_SUMMARY"

  build-native-binaries:
    if: ${{ inputs.release }}
    needs: publish
    uses: ./.github/workflows/_build-native-binaries.yml

  build-cerebro-binaries:
    if: ${{ inputs.release }}
    needs: publish
    uses: ./.github/workflows/_build-cerebro-binaries.yml

  docker-image:
    if: ${{ inputs.release }}
    needs: [publish, build-native-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⬇ Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: corvus-linux-*
          path: clients/agent-runtime/dist
          merge-multiple: true
          if-no-files-found: error

      - name: 📦 Extract Linux binaries
        working-directory: clients/agent-runtime/dist
        run: |
          set -euo pipefail
          tar -xzf corvus-linux-x64.tar.gz
          tar -xzf corvus-linux-arm64.tar.gz
          chmod +x corvus-linux-x64 corvus-linux-arm64

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 🔐 Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Docker tags and labels
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/corvus
            ghcr.io/${{ github.repository_owner }}/corvus
          tags: |
            type=raw,value=${{ needs.publish.outputs.release_version }}
            type=raw,value=${{ needs.publish.outputs.release_major_minor }},enable=${{ needs.publish.outputs.release_channel == 'stable' }}
            type=raw,value=${{ needs.publish.outputs.release_major }},enable=${{ needs.publish.outputs.release_channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.publish.outputs.release_channel == 'stable' }}
            type=raw,value=beta,enable=${{ needs.publish.outputs.release_channel == 'beta' }}

      - name: 🐳 Build and push Docker image (prebuilt binaries)
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: clients/agent-runtime/Dockerfile.release-prebuilt
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  docker-image-cerebro:
    if: ${{ inputs.release }}
    needs: [publish, build-cerebro-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⬇ Download Cerebro Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cerebro-linux-*
          path: modules/cerebro/dist
          merge-multiple: true
          if-no-files-found: error

      - name: 📦 Extract Cerebro Linux binaries
        working-directory: modules/cerebro/dist
        run: |
          set -euo pipefail
          tar -xzf cerebro-linux-x64.tar.gz
          tar -xzf cerebro-linux-arm64.tar.gz
          chmod +x cerebro-linux-x64 cerebro-linux-arm64

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 🔐 Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Cerebro Docker tags and labels
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cerebro
            ghcr.io/${{ github.repository_owner }}/cerebro
          tags: |
            type=raw,value=${{ needs.publish.outputs.release_version }}
            type=raw,value=${{ needs.publish.outputs.release_major_minor }},enable=${{ needs.publish.outputs.release_channel == 'stable' }}
            type=raw,value=${{ needs.publish.outputs.release_major }},enable=${{ needs.publish.outputs.release_channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.publish.outputs.release_channel == 'stable' }}
            type=raw,value=beta,enable=${{ needs.publish.outputs.release_channel == 'beta' }}

      - name: 🐳 Build and push Cerebro Docker image
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: modules/cerebro/Dockerfile.release-prebuilt
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

  publish-npm-platforms:
    if: ${{ inputs.release }}
    needs: build-native-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: corvus-darwin-x64
            artifact: corvus-darwin-x64
            binary: corvus
            source_binary: corvus-darwin-x64
          - pkg: corvus-darwin-arm64
            artifact: corvus-darwin-arm64
            binary: corvus
            source_binary: corvus-darwin-arm64
          - pkg: corvus-linux-x64
            artifact: corvus-linux-x64
            binary: corvus
            source_binary: corvus-linux-x64
          - pkg: corvus-linux-arm64
            artifact: corvus-linux-arm64
            binary: corvus
            source_binary: corvus-linux-arm64
          - pkg: corvus-windows-x64
            artifact: corvus-windows-x64
            binary: corvus.exe
            source_binary: corvus-windows-x64.exe
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: ⬇ Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/artifact

      - name: 📦 Extract binary
        run: |
          set -euo pipefail
          cd /tmp/artifact
          # List contents for debugging
          echo "Contents of /tmp/artifact:"
          ls -la
          # Find and extract the archive
          archive=$(find . -name "*.tar.gz" -o -name "*.zip" | head -1)
          if [ -z "$archive" ]; then
            echo "No archive found!"
            exit 1
          fi
          echo "Found archive: $archive"
          if [[ "$archive" == *.tar.gz ]]; then
            tar -xzf "$archive"
          else
            unzip -o "$archive"
          fi
          # Show extracted contents
          echo "After extraction:"
          ls -la
          # Find the packaged binary and make it executable
          find . -name "${{ matrix.source_binary }}" -type f -exec chmod +x {} \; -print

      - name: 🚀 Publish to npm
        id: publish-platform-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.publish.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ Skipping npm publish - NPM_TOKEN not configured"
            exit 0
          fi

          cd clients/agent-runtime/npm/${{ matrix.pkg }}

          # Find and copy the binary from extracted archive
          binary_path=$(find /tmp/artifact -name "${{ matrix.source_binary }}" -type f | head -1)
          if [ -z "$binary_path" ]; then
            echo "Binary not found!"
            exit 1
          fi
          echo "Copying binary from: $binary_path"
          cp "$binary_path" ./${{ matrix.binary }}

          package_name="@dallay/${{ matrix.pkg }}"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️ ${package_name}@${package_version} is already published, skipping"
            exit 0
          fi

          npm_publish_args=(--access public)
          if [ "${NPM_DIST_TAG:-latest}" != "latest" ]; then
            npm_publish_args+=(--tag "$NPM_DIST_TAG")
          fi

          npm publish "${npm_publish_args[@]}"

      - name: 📄 Summarize npm platform publish
        if: ${{ always() }}
        env:
          PLATFORM_PUBLISH_OUTCOME: ${{ steps.publish-platform-package.outcome }}
          NPM_DIST_TAG: ${{ needs.publish.outputs.npm_dist_tag }}
        run: |
          {
            echo "## npm platform publish summary"
            echo
            echo "- Package: @dallay/${{ matrix.pkg }}"
            echo "- Outcome: ${PLATFORM_PUBLISH_OUTCOME}"
            echo "- Dist-tag: ${NPM_DIST_TAG}"
            echo "- Stable publish matrix excludes corvus-cli because it is internal/private."
            echo "- Windows ARM64 is intentionally unsupported and not part of the stable npm publish matrix."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm-base:
    if: ${{ inputs.release }}
    needs: publish-npm-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ✈ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📦 Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: 🚀 Publish base package
        id: publish-base-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.publish.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ Skipping npm publish - NPM_TOKEN not configured"
            exit 0
          fi

          cd clients/agent-runtime/npm/corvus

          package_name="@dallay/corvus"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ℹ️ ${package_name}@${package_version} is already published, skipping"
            exit 0
          fi

          npm_publish_args=(--access public)
          if [ "${NPM_DIST_TAG:-latest}" != "latest" ]; then
            npm_publish_args+=(--tag "$NPM_DIST_TAG")
          fi

          npm publish "${npm_publish_args[@]}"

      - name: 📄 Summarize npm base publish
        if: ${{ always() }}
        env:
          BASE_PUBLISH_OUTCOME: ${{ steps.publish-base-package.outcome }}
          NPM_DIST_TAG: ${{ needs.publish.outputs.npm_dist_tag }}
        run: |
          {
            echo "## npm base publish summary"
            echo
            echo "- Package: @dallay/corvus"
            echo "- Outcome: ${BASE_PUBLISH_OUTCOME}"
            echo "- Dist-tag: ${NPM_DIST_TAG}"
            echo "- Stable optionalDependencies only reference shipped platforms."
            echo "- Windows ARM64 is intentionally unsupported and excluded from stable npm publication."
          } >> "$GITHUB_STEP_SUMMARY"

  release-assets:
    if: ${{ inputs.release }}
    needs: [publish, build-native-binaries, build-cerebro-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: ⬇ Download corvus release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: corvus-*
          path: dist/corvus
          merge-multiple: true
          if-no-files-found: error

      - name: ⬇ Download cerebro release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cerebro-*
          path: dist/cerebro
          merge-multiple: true
          if-no-files-found: error

      - name: 📋 Generate SHA256 checksums
        run: |
          set -euo pipefail
          for dir in dist/corvus dist/cerebro; do
            cd "$dir"
            for archive in *.tar.gz *.zip; do
              [[ -f "$archive" ]] || continue
              sha256sum "$archive" > "$archive.sha256"
            done
            ls -la
            cd "$GITHUB_WORKSPACE"
          done

      - name: 🚀 Upload assets to existing GitHub Release
        id: upload-release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
        run: |
          set -euo pipefail
          echo "Uploading assets to existing GitHub Release ${RELEASE_ID} (${RELEASE_TAG})"
          gh release upload "$RELEASE_TAG" dist/corvus/corvus-* dist/cerebro/cerebro-* --clobber --repo "$GITHUB_REPOSITORY"

      - name: 📄 Summarize GitHub Release publication
        if: ${{ always() }}
        env:
          RELEASE_CHANNEL: ${{ needs.publish.outputs.release_channel }}
          RELEASE_ASSETS_OUTCOME: ${{ steps.upload-release-assets.outcome }}
        run: |
          {
            echo "## GitHub Release publication"
            echo
             echo "- Channel: ${RELEASE_CHANNEL}"
             echo "- Outcome: ${RELEASE_ASSETS_OUTCOME}"
             echo "- Canonical public release record: existing GitHub Release for ${{ needs.publish.outputs.release_tag }}"
             echo "- Existing GitHub Release asset upload: gh release upload --clobber"
             echo "- Notes source: release-please owns canonical ${RELEASE_CHANNEL} release notes; _publish.yml must not replace them"
           } >> "$GITHUB_STEP_SUMMARY"
