# Development Environment for Corvus Agentic Testing
#
# Use this for:
# - Running the agent in a sandboxed environment
# - Testing dangerous commands safely
# - Developing new skills/integrations
#
# Usage:
#   cd dev && ./cli.sh up
#   or from root: ./dev/cli.sh up
name: corvus-dev
services:
  # ── The Agent (Development Image) ──
  # Builds from source using the 'dev' stage of the clients/agent-runtime/Dockerfile
  corvus-dev:
    build:
      context: ..
      dockerfile: clients/agent-runtime/Dockerfile
      target: dev
    container_name: corvus-dev
    restart: unless-stopped
    environment:
      - API_KEY
      - PROVIDER
      - CORVUS_MODEL
      - CORVUS_GATEWAY_PORT=3000
      - SANDBOX_HOST=corvus-sandbox
    volumes:
      # Mount full config directory so atomic config writes work inside the container.
      - ../clients/agent-runtime/target/.corvus:/corvus-data/.corvus
      # Mount shared workspace
      - ../clients/agent-runtime/target/playground:/corvus-data/workspace
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - dev-net

  # ── The Sandbox (Ubuntu Environment) ──
  # A fully loaded Ubuntu environment for the agent to play in.
  sandbox:
    build:
      context: sandbox # Context relative to dev/
      dockerfile: Dockerfile
    container_name: corvus-sandbox
    hostname: dev-box
    command: ["tail", "-f", "/dev/null"]
    working_dir: /home/developer/workspace
    user: developer
    environment:
      - TERM=xterm-256color
      - SHELL=/bin/bash
    volumes:
      - ../playground:/home/developer/workspace # Mount local playground
    networks:
      - dev-net

  # ── Optional Dashboard (Local-first) ──
  # Build Vue dashboard and serve static dist via unprivileged nginx.
  dashboard-dev:
    build:
      context: ../clients/web
      dockerfile: apps/dashboard/Dockerfile
    container_name: corvus-dashboard-dev
    restart: unless-stopped
    profiles: ["dashboard"]
    depends_on:
      - corvus-dev
    ports:
      - "127.0.0.1:4324:8080"
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge
