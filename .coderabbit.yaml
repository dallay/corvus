# CodeRabbit configuration for Corvus
# Documentation: https://docs.coderabbit.ai/reference/configuration
# Priorities: security first, performance second, and TDD-oriented reviews.

language: en-US
early_access: false
tone_instructions: >
  Be concise and actionable. Prioritize security and behavioral regressions before style nits.

reviews:
  profile: assertive
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  sequence_diagrams: true
  review_status: true
  review_details: true

  suggested_labels: true
  labeling_instructions:
    - label: "risk:security"
      instructions: >
        Changes touching secrets, authN/authZ, crypto, network boundaries, untrusted input,
        deserialization, command execution, or dependency security.
    - label: "risk:performance"
      instructions: >
        Changes with algorithmic complexity impact, startup/memory regressions, I/O hot paths,
        render loops, or extra allocations in critical code.
    - label: "risk:high"
      instructions: >
        Broad architectural impact, migration risk, rollback complexity, or multi-module contract
        changes.
    - label: "area:kotlin"
      instructions: Kotlin/JVM/KMP source or tests are modified.
    - label: "area:rust"
      instructions: Rust crates, FFI boundaries, runtime internals, or Rust tests are modified.
    - label: "area:gradle"
      instructions: Build logic, version catalogs, plugins, CI build config, or lockfiles change.
    - label: "area:docs"
      instructions: Documentation, guides, architecture notes, or MD/MDX content changed.
    - label: "area:ci"
      instructions: GitHub Actions, release pipelines, Docker, or automation scripts changed.
  auto_apply_labels: true

  suggested_reviewers: true
  auto_assign_reviewers: false

  # Auto-review configuration
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    base_branches:
      - main
      - develop
    labels:
      - "!wip"
      - "!do-not-review"
    ignore_title_keywords:
      - WIP
      - DO NOT REVIEW
    drafts: false

  poem: false

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    title:
      mode: warning
      requirements: >
        Use clear imperative titles; prefer Conventional Commit-style prefixes when possible
        (feat/fix/refactor/docs/chore/test).
    description:
      mode: warning
    issue_assessment:
      mode: warning

  tools:
    clippy:
      enabled: true
    detekt:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    checkmake:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true

  # Ignore generated/cached artifacts, but keep lockfiles visible for supply-chain review.
  path_filters:
    - "!**/target/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/.gradle/**"
    - "!**/.cargo/**"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Focus on Rust idioms, memory safety, and ownership/borrowing correctness.
        Flag unnecessary clones, unchecked panics in production paths, and weak error context.
        Prioritize unsafe blocks, FFI boundaries, concurrency races, and secret handling.
    - path: "**/*.kt"
      instructions: |
        Enforce null safety (no !!), structured concurrency, and non-blocking suspend code.
        Prefer idiomatic Kotlin (expression bodies, sealed types, value classes when justified).
        Verify tests follow TDD intent and use backtick test names where applicable.
    - path: "**/*.gradle.kts"
      instructions: |
        Prefer tasks.register/configureEach, avoid afterEvaluate, and preserve configuration cache.
        Ensure dependencies come from version catalogs and avoid eager task realization.
        Review plugin/config changes for supply-chain and reproducibility risks.
    - path: "**/*.{md,mdx}"
      instructions: |
        Verify technical accuracy and that docs stay aligned with code changes.
        For user-facing docs, check EN/ES parity or explicitly note pending translation gaps.
    - path: "**/*"
      instructions: |
        Security first, performance second.
        Validate input boundaries, auth/authz implications, and secret management.
        Look for behavioral regressions, missing tests, and contract breaks across modules.

chat:
  auto_reply: true
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - .github/copilot-instructions.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
  web_search:
    enabled: true

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "**/*.kt"
        instructions: >
          Use concise KDoc, document nullability/side effects, and avoid restating obvious names.
      - path: "**/*.rs"
        instructions: >
          Use rustdoc with safety notes for unsafe code and clear error/return semantics.
  unit_tests:
    path_instructions:
      - path: "**/*.kt"
        instructions: >
          Follow Red-Green-Refactor mindset; include edge cases and coroutine behavior.
      - path: "**/*.rs"
        instructions: >
          Cover ownership/lifetime-sensitive paths, error variants, and concurrency scenarios.
