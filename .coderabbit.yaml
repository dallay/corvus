# CodeRabbit configuration for Corvus
# Documentation: https://docs.coderabbit.ai/reference/configuration

language: en-US
early_access: false

# Enable tone control for reviews
reviews:
  # Request changes workflow
  request_changes_workflow: false
  
  # High level summary of the PR
  high_level_summary: true
  
  # Generate sequence diagrams
  sequence_diagrams: true
  
  # Auto-review configuration
  auto_review:
    enabled: true
    # Only review PRs targeting these branches
    base_branches:
      - main
      - develop
    # Skip reviews for draft PRs or WIP
    drafts: false
    # Enable base branch analysis
    base_branch_analysis: true
  
  # Poem configuration
  poem:
    enabled: false
  
  # Reviewer suggestions
  reviewer:
    # Suggest reviewers based on blame data
    enabled: true
    # Automatically assign suggested reviewers
    auto_assign: false
  
  # Enable finishing touches
  finishing_touches:
    # Generate docstrings
    docstrings:
      enabled: true
    # Generate unit tests
    unit_tests:
      enabled: true

# Tools configuration
tools:
  # Rust-specific tools
  cargo:
    enabled: true
  # Kotlin/JVM tools
  gradle:
    enabled: true
  
# Chat configuration
chat:
  auto_reply: true

# Path filters - ignore generated files and build artifacts
path_filters:
  - "!**/target/**"
  - "!**/build/**"
  - "!**/node_modules/**"
  - "!**/.gradle/**"
  - "!**/.cargo/**"
  - "!**/Cargo.lock"
  - "!**/pnpm-lock.yaml"
  - "!**/*.lockfile"

# Unified review instructions for the multi-module project
review_instructions:
  - "Focus on project-wide best practices and idiomatic code for both Rust and Kotlin."
  - "Rust: Focus on memory safety, proper use of lifetimes, and avoiding unnecessary clones."
  - "Rust: Ensure proper error handling with Result types and idiomatic anyhow/thiserror usage."
  - "Kotlin/KMP: Emphasize null safety, avoiding the !! operator, and using idiomatic Kotlin patterns like expression bodies."
  - "Kotlin/KMP: Use sealed interfaces/classes for results and state representation."
  - "Kotlin/KMP: Ensure proper use of coroutines and avoid blocking calls in suspend functions."
  - "Security: Check for vulnerabilities in encryption, crypto code, and configuration handling."
  - "Testing: Verify that tests cover critical paths and follow established naming conventions (e.g., backticks for Kotlin tests)."
  - "Architecture: Ensure changes respect the multi-module structure and contract boundaries between KMP and Rust sidecars."
